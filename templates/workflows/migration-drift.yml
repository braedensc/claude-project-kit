name: Migration drift check

# ══════════════════════════════════════════════════════════════════════════════
# Standing drift monitor — INERT template (activate at bootstrap:
# `git mv templates/workflows/migration-drift.yml .github/workflows/`).
#
# ⚠ Supabase/Postgres EXAMPLE of a portable pattern — swap the query, keep the
# chassis. UNIVERSAL SKELETON: daily off-hour cron + workflow_dispatch,
# preflight-skip-green, a READ-ONLY "does prod actually have everything the repo
# says it should" probe, then the open/update-deduped-issue + @mention/assign
# chassis. STACK-SPECIFIC (fenced below): the Supabase dry-run + grep detection
# step — substitute your platform's read-only desired-vs-actual diff
# (`terraform plan`, `prisma migrate status`, `flyway info`, …).
#
# Why it exists (learned in production): a deploy failed AFTER merge (PR CI was
# green — the post-merge deploy is a separate workflow) and prod silently fell
# 5 migrations behind. This is the standing monitor: it opens/updates a GitHub
# issue the moment prod is behind. Complements deploy-failure-alert.yml — that
# catches the deploy ERRORING; this catches drift however it arises (a skipped
# migrate step, a manual DB change, a deploy that never ran).
#
# Config: reuses the Secret BACKUP_DATABASE_URL (one prod-DB secret, one source
# of truth — see templates/workflows/backup-cron.yml for the pooler/IPv4
# gotchas). Until it is set the job runs green but SKIPS — correct here, since
# this is a monitor, not a deploy: an unconfigured fork is never red.
#
# WHO is paged: the ALERT_PAGE_TO repository variable (logins or org/team,
# comma-separated; not a secret) when set; else the repository owner when that
# is a person. On an org-owned repo with no variable set, drift still files the
# issue, which says "Nobody was paged", and the run FAILS — an @mention of an
# organization notifies nobody (see pipeline-failure-alert.yml).
#
# NOTE: scheduled workflows only run from the DEFAULT branch (main). Trigger
# manually (workflow_dispatch) to test.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '17 13 * * *' # daily 13:17 UTC — off the top of the hour to dodge Actions load
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Check prod is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight — is the DB URL configured?
        id: pre
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::BACKUP_DATABASE_URL not set — skipping drift check."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # STACK-SPECIFIC: Supabase/Postgres detection. Swap this block for your
      # platform's read-only desired-vs-actual diff; keep the contract: set
      # `drift=true|false` and a `pending` multiline output listing what's missing.
      # ════════════════════════════════════════════════════════════════════════
      - uses: actions/checkout@v4
        if: steps.pre.outputs.configured == 'true'

      - uses: supabase/setup-cli@v2
        if: steps.pre.outputs.configured == 'true'
        with:
          version: 2.107.0

      # Read-only: --dry-run never writes. When prod is behind, the CLI prints
      # "Would push these migrations:" followed by each pending file; that phrase is
      # the drift signal. --include-all mirrors the deploy's out-of-order tolerance.
      - name: Detect unapplied migrations (dry-run)
        id: drift
        if: steps.pre.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          out=$(supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run 2>&1) || true
          echo "$out"
          if printf '%s' "$out" | grep -q 'Would push these migrations:'; then
            pending=$(printf '%s\n' "$out" | grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' | sort -u)
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "pending<<PENDING_EOF"
              printf '%s\n' "$pending"
              echo "PENDING_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      # ════════════════════════════════════════════════════════════════════════
      # END STACK-SPECIFIC — the issue chassis below is universal.
      # ════════════════════════════════════════════════════════════════════════

      - name: Open/update a drift issue
        if: steps.pre.outputs.configured == 'true' && steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v7
        env:
          PENDING: ${{ steps.drift.outputs.pending }}
          ALERT_PAGE_TO: ${{ vars.ALERT_PAGE_TO }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            // ── WHO THIS ALERT PAGES ── identical in every alert template (scripts/check_alert_pages.py
            // runs each copy). An @mention of an ORGANIZATION notifies nobody and an organization
            // cannot be assigned, so the repository owner is never paged blindly. In order: the
            // ALERT_PAGE_TO repository variable (logins or org/team, comma- or space-separated);
            // else the owner, when the owner is a person. When neither applies the issue is still
            // filed, says "Nobody was paged", and the run FAILS: a page that reaches nobody must
            // not look delivered.
            async function alertRecipients() {
              const { owner, repo } = context.repo
              const names = (process.env.ALERT_PAGE_TO || '').split(/[\s,]+/).filter(Boolean).map((n) => n.replace(/^@/, ''))
              // A login, or an org/team slug. Nothing else is ever embedded after an `@`.
              const mentionable = /^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\/[A-Za-z0-9][A-Za-z0-9._-]{0,99})?$/
              const rejected = names.filter((n) => !mentionable.test(n))
              const logins = [...new Set(names.filter((n) => mentionable.test(n)))]
              if (logins.length) return { logins, whose: 'ALERT_PAGE_TO', rejected }
              let ownerType
              try {
                ownerType = (await github.rest.repos.get({ owner, repo })).data.owner.type
              } catch (e) {
                core.warning(`could not read who owns ${owner}/${repo}: ${e.message}`)
                return { logins: [], whose: 'this run could not read who owns the repository. Set the ALERT_PAGE_TO repository variable to the logins that should be paged', rejected }
              }
              if (ownerType === 'User') return { logins: [owner], whose: 'the repository owner', rejected }
              return { logins: [], whose: 'the repository owner is an organization, which an @mention does not notify. Set the ALERT_PAGE_TO repository variable to the logins that should be paged', rejected }
            }
            function pageLine({ logins, whose }, what) {
              if (!logins.length) return `**Nobody was paged:** ${whose}.`
              return `cc ${logins.map((l) => '@' + l).join(', ')} (${whose}) — ${what}`
            }
            // Assign whoever the page names (the "assign" reason keeps them subscribed to later
            // comments), then fail the run if the page named nobody or the variable was malformed.
            async function page(issue_number, { logins, whose, rejected }) {
              const { owner, repo } = context.repo
              const people = logins.filter((l) => !l.includes('/')) // a team is mentioned, never assigned
              if (people.length) {
                try {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: people })
                } catch (e) { // e.g. not a collaborator: the @mention is the page, this is extra
                  core.warning(`#${issue_number}: could not assign ${people.join(', ')}: ${e.message}`)
                }
              }
              if (rejected.length) core.setFailed(`ALERT_PAGE_TO names ${JSON.stringify(rejected)}, which is not a GitHub login or org/team`)
              if (!logins.length) core.setFailed(`#${issue_number}: this alert paged NOBODY — ${whose}.`)
            }
            // ── end WHO THIS ALERT PAGES ──
            // The stable title IS the dedupe key — change it and you fork the issue.
            const title = '⚠️ Prod database is behind (unapplied migrations)'
            const recipients = await alertRecipients()
            const pending = (process.env.PENDING || '').trim().split('\n').filter(Boolean)
            const body = [
              `The daily drift check found ${pending.length} migration(s) in the repo that are **not applied to prod**:`,
              '',
              ...pending.map((p) => `- \`${p}\``),
              '',
              'Prod is behind — usually a deploy that failed or was skipped. Check the latest **Deploy (prod)** run and its `migrate` job, then re-run it from `main` (Actions → Deploy (prod) → Run workflow) once the cause is fixed.',
              '',
              // @mention + assign a person so this reaches them even under a
              // "Participating and @mentions" watch (see pipeline-failure-alert.yml).
              pageLine(recipients, 'prod database is behind the repo.'),
            ].join('\n')
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const existing = open.data.find((i) => i.title === title && !i.pull_request)
            let number
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body })
              number = existing.number
              core.info(`Updated #${number}`)
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body })
              number = created.data.number
              core.info(`Opened #${number}`)
            }
            await page(number, recipients)
