name: Deploy (prod)

# ══════════════════════════════════════════════════════════════════════════════
# The deploy-on-green pattern — distilled from a shipped deploy.yml,
# live in production since 2026-07-02: it ran the real cutover deploy (migrations
# + Edge Functions) and every deploy after it.
#
# UNIVERSAL SKELETON (keep for any platform): workflow_run success gate,
# dispatch-from-main guard, exact-SHA checkout, sequential migrate → deploy,
# no-cancel concurrency, per-job timeouts, preflights with a LIFECYCLE
# (skip-green before first seed, fail-loud after — fenced blocks in each
# preflight below), deploy targets DERIVED FROM THE TREE, and a smoke that
# probes every target for ABSENCE signals (retrying cold starts) instead of
# asserting one expected code.
# STACK-SPECIFIC (fenced below): the Supabase step bodies — swap for your
# platform, keep the skeleton.
#
# ── Careful gating (why a bad merge can't wedge prod) ─────────────────────────
#   • Trigger is `workflow_run` on the CI workflow COMPLETING SUCCESSFULLY on
#     `main` — not a raw `push`. Prod only ever changes AFTER the full CI gate
#     went green on the exact merged commit. `branches: [main]` filters on the
#     CI run's head_branch: a pull_request CI run's head_branch is the PR's
#     SOURCE branch (e.g. `feat/x`), so PR-branch CI is excluded; only the
#     push-to-main CI run (head_branch == main) matches. If main's CI goes red,
#     deploy is skipped.
#   • Jobs are SEQUENTIAL: migrate → deploy (`needs:`). If migrations error, the
#     app deploy is skipped. Do NOT add `if: always()` / `continue-on-error`
#     downstream — that re-enables deploys after a failed migration/CI.
#   • Migration application must be idempotent (only applies what the remote
#     hasn't seen); a `--dry-run` preview is logged first as an audit trail.
#   • `concurrency` + per-job `timeout-minutes` mean a hung deploy can't hold
#     the lock forever.
#
# ── The workflow_run trap that WILL get you once ──────────────────────────────
#   workflow_run uses this file's version on the DEFAULT branch. Edits take
#   effect only once merged to main; you cannot exercise the workflow_run path
#   from a feature branch (docs/LESSONS.md). Use workflow_dispatch (main only)
#   for the first seed deploy and manual re-deploys.
#
# ── Rollback (honest runbook — git revert does NOT undo applied DDL) ──────────
#   Databases don't auto-run `down` migrations; reverting a migration file just
#   stops it re-applying. Roll a schema change back by running its hand-written
#   `-- down:` block against prod, then removing its row from the migrations
#   ledger; for a data-lossy change, restore the encrypted backup (take an
#   on-demand backup BEFORE a risky migration). Roll the frontend back with your
#   host's tooling (e.g. `vercel rollback`) — it's independent.
#
# ── Config (repo → Settings → Secrets and variables → Actions) ────────────────
#   Secret   BACKUP_DATABASE_URL   = prod DB connection string used for
#            migrations. This pattern REUSES the backup job's secret (one secret,
#            one source of truth — the free Supabase pooler forces the same
#            `postgres` user for read and write anyway). See
#            templates/workflows/backup-cron.yml for the IPv4/pooler gotchas.
#   Secret   SUPABASE_ACCESS_TOKEN = platform deploy token (NOT a DB credential).
#   Variable SUPABASE_PROJECT_REF  = the prod project identifier.
#   PREREQUISITE for runtime config (set on the PLATFORM, not here): server-side
#   secrets like your AI key and ALLOWED_ORIGIN must be set as function secrets
#   (e.g. `supabase secrets set`), or deployed functions fail at runtime. The
#   post-deploy smoke asserts reachability but cannot check those.
#
# ── Preflight lifecycle (skip-green is a PHASE, not a policy) ─────────────────
#   As shipped, each job PREFLIGHTS its own config and SKIPS (green) when unset —
#   the workflow merges and stays green until the secrets are added (mirrors
#   backup-cron.yml / keepalive.yml: a fork is never red out of the box).
#   AFTER YOUR FIRST SUCCESSFUL DEPLOY, flip both preflights to the fail-loud
#   variants commented inline below. Post-seed, a missing/rotated secret must
#   FAIL the run: a silent skip once shipped functions against an un-migrated
#   schema with the run still green (the 2026-07-13 incident) — and a green run
#   is invisible to pipeline-failure-alert.yml, which only fires on a FAILED
#   conclusion.
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # only actions/checkout needs it; deploy auth is via secrets, not GITHUB_TOKEN

# One prod deploy at a time. cancel-in-progress: false — never interrupt an
# in-flight migration mid-apply; queue instead. Per-job timeouts (below) stop a
# hung run from holding this lock.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — CI passed on main
    runs-on: ubuntu-latest
    timeout-minutes: 5 # gate is one no-network step, but it holds the concurrency lock too
    # Proceed only when the triggering CI run SUCCEEDED, or for a manual
    # dispatch FROM MAIN. The `github.ref == main` guard closes the hole where
    # `gh workflow run deploy.yml --ref <any-branch>` could push an unreviewed,
    # CI-failing branch straight to prod. For extra safety, wire an
    # `environment: production` with a required reviewer in repo settings.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the commit to deploy
        id: resolve
        run: |
          # workflow_dispatch → the current main tip (which passed CI to merge);
          # workflow_run → the EXACT commit CI validated (github.sha would be
          # main's tip, not necessarily what CI ran on). Downstream jobs check
          # this SHA out.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          [ -n "$sha" ] || { echo "::error::could not resolve a commit SHA to deploy"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════════════════════
  # STACK-SPECIFIC FROM HERE DOWN — Supabase (Postgres migrations + Deno Edge
  # Functions). Swap the step bodies for your datastore/platform; keep the
  # preflight lifecycle, exact-SHA checkout, `needs:` chain, timeouts,
  # tree-derived target discovery, and the absence-signal smoke.
  # ════════════════════════════════════════════════════════════════════════════
  migrate:
    name: Apply migrations to prod
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung migration aborts (releasing any DB lock) instead of wedging deploys
    steps:
      - name: Preflight — is the DB URL configured?
        id: pre
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            # ::warning:: (not ::notice::) so a green run is never mistaken for "migrations applied".
            echo "::warning::BACKUP_DATABASE_URL not set — SKIPPING migrations."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # ── AFTER YOUR FIRST SUCCESSFUL DEPLOY flip these — a skipped deploy is ──────
            # invisible to pipeline-failure-alert. Replace the two lines above with:
            #   echo "::error::BACKUP_DATABASE_URL not set — cannot apply migrations. Set it (Settings → Secrets → Actions) and re-run Deploy (prod)."
            #   exit 1
            # Post-seed, skip-green means a rotated/vanished secret ships a silent
            # half-deploy forever: 2026-07-13 saw functions shipped against an
            # un-migrated schema on a GREEN run, and the alert workflow (which only
            # fires on a `failure` conclusion) never saw it.
            # ─────────────────────────────────────────────────────────────────────────────
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pre.outputs.configured == 'true'
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: supabase/setup-cli@v2
        if: steps.pre.outputs.configured == 'true'
        with:
          version: 2.107.0

      # The DB URL holds the DB password — keep it in env and referenced as
      # "$SUPABASE_DB_URL" (never inline, never with `set -x`/`--debug`, or the
      # DSN leaks into logs).
      #
      # --include-all: apply migrations whose version sorts BEFORE the last one
      # already on remote. Parallel feature branches routinely merge migrations
      # out of timestamp order (a branch cut before another's migration lands
      # ends up "in the past"); without this flag, db push hard-stops on the
      # first such file and NO further migration or function deploy reaches
      # prod — in one incident prod silently fell 5 migrations behind for
      # hours. Versions stay unique, so ordering within a push is deterministic;
      # --include-all only relaxes the "must be newer than remote's latest"
      # guard. Ordering is enforced at PR time instead — see
      # templates/scripts/check-migrations.mjs (tolerate out-of-order at deploy
      # time, enforce ordering at PR time).
      - name: Preview pending migrations (dry-run, audit only)
        if: steps.pre.outputs.configured == 'true'
        continue-on-error: true # informational; never block the deploy on the preview
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Apply migrations (db push)
        if: steps.pre.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        # `db push` has NO --yes flag and can hang on a "[Y/n]" prompt on some
        # CI runners (supabase/cli#2238); pipe `yes` to force non-interactive.
        # Pipeline exit status is db push's, so a failed migration still fails
        # the step.
        run: yes | supabase db push --db-url "$SUPABASE_DB_URL" --include-all

  deploy-functions:
    name: Deploy Edge Functions
    # Runs after migrate so functions never ship against a failed/half-applied
    # schema. If migrate SKIPS (unconfigured) it still "succeeds", so functions
    # can deploy on their own — one more reason to flip the preflights to
    # fail-loud post-seed: a hard-failing migrate makes this `needs:` chain
    # actually block the function deploy.
    needs: [gate, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bundling can take minutes; bound it so a hang can't hold the lock
    steps:
      - name: Preflight — is the access token configured?
        id: pre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — SKIPPING function deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # ── AFTER YOUR FIRST SUCCESSFUL DEPLOY flip these — a skipped deploy is ──────
            # invisible to pipeline-failure-alert. Replace the two lines above with:
            #   echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — cannot deploy functions. Set them (Settings → Secrets/Variables → Actions) and re-run Deploy (prod)."
            #   exit 1
            # Post-seed, skip-green means a rotated credential leaves prod silently
            # running the stale function bundle on a green run — no failure event,
            # no alert.
            # ─────────────────────────────────────────────────────────────────────────────
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pre.outputs.configured == 'true'
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: supabase/setup-cli@v2
        if: steps.pre.outputs.configured == 'true'
        with:
          version: 2.107.0

      - name: Discover deployable functions
        id: discover
        if: steps.pre.outputs.configured == 'true'
        run: |
          # Derive the deploy list from the TREE instead of hardcoding it — the
          # glob is the stack-specific bit to adapt; the pattern (deploy targets
          # come from the repo, never a hand-maintained list) is universal.
          # Every Edge Function is a directory under supabase/functions/ with an
          # index.ts; globbing */index.ts naturally excludes _shared (a helper
          # dir, no index.ts) and any non-function file. A newly added function
          # is now deployed AND smoke-tested automatically — a hardcoded
          # omission once left a scheduled function undeployed while its cron
          # POST 404'd every minute, silently green.
          fns=""
          for idx in supabase/functions/*/index.ts; do
            [ -f "$idx" ] || continue # zero matches → literal glob; skip it
            name=$(basename "$(dirname "$idx")")
            [ "$name" = "_shared" ] && continue # defensive: _shared has no index.ts today
            fns="${fns:+$fns }$name"
          done
          if [ -z "$fns" ]; then
            echo "::error::no deployable functions found under supabase/functions/*/index.ts — refusing to deploy nothing"
            exit 1
          fi
          echo "Deployable functions: $fns"
          echo "fns=$fns" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        if: steps.pre.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FNS: ${{ steps.discover.outputs.fns }}
        run: |
          # Deploy every function the discover step found (list derived from the
          # tree, not hardcoded — a function can no longer be silently omitted).
          #   --use-api      : bundle server-side, no Docker (removes a whole CI failure class).
          #   --no-verify-jwt: turn OFF the gateway JWT check so the CORS OPTIONS
          #                    preflight reaches the function; each function
          #                    verifies the JWT itself (_shared/auth.ts) and RLS
          #                    isolates data. Mirrors `verify_jwt = false` in
          #                    supabase/config.toml (belt-and-suspenders).
          for fn in $FNS; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
            echo "::endgroup::"
          done

      # Cheap post-deploy smoke: prove EVERY discovered function actually landed
      # and is reachable. Auth differs per function (own-JWT functions answer
      # 401, shared-secret ones 403, a body-validating public one 400), so we
      # can't assert one expected code for all: the smoke asserts the response
      # is NOT a not-deployed signal instead — FAIL on 404 (function absent),
      # 000 (no response/timeout), or 5xx (deployed but crashing); PASS on
      # anything it actually answered with (401/403/400/2xx). Deeper
      # CORS/ALLOWED_ORIGIN verification is a separate manual step (needs the
      # prod origin) — see docs/SECURITY.md.
      #
      # Retry with backoff: a function's FIRST hit after deploy is a COLD
      # isolate boot, so a single probe can exceed --max-time and 000 an
      # otherwise-healthy deploy (a docs-only deploy once failed on exactly
      # that). Probe each function up to $TRIES times with linear backoff — the
      # first attempt doubles as a warmup, and only a function STILL failing on
      # its LAST attempt fails the step. Retry absorbs cold-start jitter, it
      # does not paper over a real outage: a persistently absent (404) or
      # crashing (5xx) function still fails. Worst case (a total outage — every
      # fn, every attempt) stays within this job's timeout-minutes.
      - name: Smoke — functions reachable
        if: steps.pre.outputs.configured == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FNS: ${{ steps.discover.outputs.fns }}
        run: |
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          TRIES=3
          failed=""
          for fn in $FNS; do
            code=000
            attempt=1
            while [ "$attempt" -le "$TRIES" ]; do
              # `|| true` + default keeps a curl timeout/connection error
              # (non-zero exit, code 000) from aborting the loop under `set -e`,
              # so every function is probed and reported.
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 20 \
                -H 'content-type: application/json' -d '{}' "$base/$fn" || true)
              code=${code:-000}
              case "$code" in
                # Not-deployed / no-response / crash — treat as a cold-boot
                # transient: back off and retry, unless this was the last
                # attempt (then it falls through to fail below).
                404|000|5??)
                  if [ "$attempt" -lt "$TRIES" ]; then
                    echo "retry: $fn → HTTP $code (attempt $attempt/$TRIES)"
                    sleep $((attempt * 2))
                  fi
                  ;;
                # Any real answer (401/403/400/2xx) → reachable; stop retrying.
                *) break ;;
              esac
              attempt=$((attempt + 1))
            done
            case "$code" in
              404) echo "::error::$fn → HTTP 404 (function not deployed)"; failed="$failed $fn" ;;
              000) echo "::error::$fn → no response / unreachable (curl 000)"; failed="$failed $fn" ;;
              5??) echo "::error::$fn → HTTP $code (deployed but erroring)"; failed="$failed $fn" ;;
              *) echo "✓ $fn → HTTP $code (deployed + reachable)" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::post-deploy smoke failed for:$failed"
            exit 1
          fi
          echo "All functions reachable."
