name: CI

# ══════════════════════════════════════════════════════════════════════════════
# App-project CI — distilled from a production build's ci.yml, the gate for
# every PR from 2026-06-23 → 2026-07-03. The kit repo's own smaller CI
# is .github/workflows/ci.yml; THIS file is the one your app project activates
# (see templates/README.md — `git mv` it to .github/workflows/ci.yml).
#
# Layer 3 of the security/quality model — the unbypassable gate (--no-verify
# can't skip it). Seven parallel jobs on every push to main and every PR (the
# hooks guard is PR-only):
#   - "Secret scan + forbidden paths" — secretlint + planning//.env path gate
#   - "Provenance scan"               — no private names / home paths / real emails
#   - "Lint" / "Typecheck" / "Test"  — adapt the npm scripts to your toolchain
#   - "E2E (smoke)"                  — non-required by design (see its comment)
#   - "Hooks change guard"           — PR-only label gate on guard-machinery edits
# Plus two commented STUBS to adapt at the bottom: a second-runtime gate and a
# migration guard.
#
# ── Two rules that bite if you skip them ──────────────────────────────────────
# 1. Each job's `name:` IS the required-status-check context string.
# 2. Merge THEN require: add contexts to branch protection only AFTER they have
#    reported at least once on main — requiring a context that has never run
#    wedges every open PR waiting on it (docs/LESSONS.md). Adding later without
#    dropping existing ones:
#      gh api -X POST repos/<owner>/<repo>/branches/main/protection/required_status_checks/contexts \
#        -f 'contexts[]=Lint' -f 'contexts[]=Typecheck' -f 'contexts[]=Test'
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  # Run on every PR regardless of base branch — so stacked PRs (base != main)
  # are gated too, not just PRs that target main directly. `labeled`/`unlabeled`
  # are included so "Hooks change guard" re-evaluates the moment a
  # `hooks-change` label is added or removed (the default PR activity types —
  # opened/synchronize/reopened — don't cover labels).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  secrets-and-paths:
    name: Secret scan + forbidden paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hook battery ships as a permanent CI step (needs only python3 + git,
      # both preinstalled) — every edit to .claude/hooks/pre-tool-use.py is
      # regression-gated forever.
      - name: Hook battery (block/allow)
        run: python3 .claude/hooks/test_hooks.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block forbidden paths (planning/, real .env, key material)
        run: |
          FORBIDDEN=$(git ls-files \
            | grep -E '^planning/|(^|/)\.env|\.pem$|\.key$' \
            | grep -v -E '(^|/)\.env\.example$' \
            || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files are tracked in git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: secretlint (scan all tracked files)
        run: git ls-files -z | xargs -0 npx secretlint --secretlintrc .secretlintrc.json

  # Provenance guard (runs the kit's scripts/check_provenance.py). Names that
  # must never appear in this repo — a client, an internal codename, the private
  # project a public repo was distilled from — live in a repo VARIABLE (Settings
  # → Secrets and variables → Actions → Variables → PROVENANCE_DENYLIST), never
  # in the tree: committing a file of the words you are suppressing would BE the
  # leak. An unset variable makes the term check a no-op; the absolute-home-path
  # and email rules need no config and run either way, so a teammate's
  # "/Users/<them>/…" path or a real address can't creep in regardless.
  #
  # Once you HAVE set the variable, add `PROVENANCE_REQUIRE_DENYLIST: "1"` to the
  # env below: an undefined variable renders empty, and without that flag the
  # term rule would silently no-op green forever — looking exactly like a clean
  # scan. It's left off here on purpose so a fresh project isn't broken out of
  # the box before anyone has named a word to forbid.
  provenance-scan:
    name: Provenance scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No private names, home paths, or real emails in tracked files
        env:
          PROVENANCE_DENYLIST: ${{ vars.PROVENANCE_DENYLIST }}
        run: python3 scripts/check_provenance.py

  # ── Adapt the three jobs below to your toolchain (script names are the
  #    contract: lint / format:check / typecheck / test). ─────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc -b
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + component tests
        run: npm test

  # E2E smoke. Deliberately NOT a required check (promote once it's proven
  # stable) so a flaky browser run can't wedge main. The smoke config boots the
  # app with DUMMY env (no database, no secrets) — see docs/TESTING.md for the
  # smoke-in-CI vs DB-backed-golden-local-only split and why CI never points an
  # E2E suite at a real database.
  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

  # Server-side backstop for hook self-protection (docs/SECURITY.md; from a
  # production build's audit job). The local PreToolUse guard constrains
  # only sessions that run the hook — a PR authored anywhere else (another
  # clone, the GitHub web UI, an @claude workflow) never meets it. So a PR that
  # changes the guard machinery (.claude/hooks/** or .claude/settings*.json)
  # must not land unnoticed: it has to carry an explicit `hooks-change` label.
  # Operational notes (learned in production):
  #   - the `hooks-change` label must EXIST in your repo before this job's
  #     first run can pass on a guarded PR — one-time setup:
  #       gh label create hooks-change --color D93F0B \
  #         --description 'Acknowledges a PR that intentionally edits the Claude hook guard machinery'
  #   - adding/removing the label re-runs the check via the labeled/unlabeled
  #     trigger types above; if a run ever wedges, an empty commit gives a
  #     clean re-run;
  #   - this flag only becomes a real gate once branch protection requires a
  #     review (required_approving_review_count >= 1, owner-set in the GitHub
  #     UI) so a human actually sees it. PR-only — a push to main has no label
  #     context.
  hooks-change-guard:
    name: Hooks change guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the 'hooks-change' label to edit hook/settings files
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          SENSITIVE=$(printf '%s\n' "$CHANGED" | grep -E '^\.claude/(hooks/|settings[^/]*\.json$)' || true)
          if [ -z "$SENSITIVE" ]; then
            echo "No security-hook files changed — nothing to gate."
            exit 0
          fi
          echo "This PR modifies security-critical hook/settings files:"
          printf '  %s\n' $SENSITIVE
          for label in $LABELS; do
            if [ "$label" = "hooks-change" ]; then
              echo "OK: 'hooks-change' label present — change acknowledged."
              exit 0
            fi
          done
          echo "::error::This PR changes .claude/hooks/** or .claude/settings*.json — the guard machinery that self-protection makes human-only locally. Edits must be reviewed, not silent. Add the 'hooks-change' label to acknowledge, then this check re-runs."
          exit 1

  # ── Second-runtime gate (COMMENTED STUB — adapt if any subtree runs a
  #    runtime your main toolchain doesn't) ───────────────────────────────────
  # The lesson, in one line: no tree your primary toolchain skips goes ungated.
  # In one real build (the skipped-Deno-tree incident) the Deno edge-function
  # tree sat invisible to tsc -b and ESLint — nothing in CI type-checked or
  # tested the server-side capability/guardrail/prompt logic, the exact gap
  # behind the "three-readers" class of bugs — and the first gate added
  # immediately surfaced real pre-existing type drift. Enumerate every
  # language/runtime tree in your repo (edge functions, workers, a scripts/ dir
  # in another language) and give each its own typecheck+test job; the job
  # `name:` becomes its required-check context.
  #
  # second-runtime:
  #   name: Second runtime            # e.g. "Deno"
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     # Toolchain setup for THAT runtime, e.g.:
  #     #   - uses: denoland/setup-deno@v2
  #     #     with:
  #     #       deno-version: v2.x
  #
  #     - name: Type-check the skipped tree
  #       working-directory: path/to/that/tree
  #       run: echo "e.g. deno check _shared/*.ts */index.ts"
  #
  #     - name: Run that tree's tests
  #       working-directory: path/to/that/tree
  #       run: echo "e.g. deno task test"

  # ── Migration guard (COMMENTED STUB — adapt if your schema lives in ordered
  #    migration files) ───────────────────────────────────────────────────────
  # PR-only ordered-file collision check: fails on a DUPLICATE migration
  # version (migrations-ledger PK collision) or an OUT-OF-ORDER one (sorts
  # before main's latest, so the deploy tool hard-stops and applies nothing
  # further — the two mistakes that wedged a real prod deploy on
  # 2026-07-09). Compares against the freshly-fetched main tip, so a parallel
  # branch that grabbed the same or an earlier timestamp fails HERE instead of
  # silently after merge.
  # The checker ships with the kit as templates/scripts/check-migrations.mjs —
  # copy it to scripts/check-migrations.mjs when you activate this job.
  #
  # migration-guard:
  #   name: Migration guard
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #
  #     - name: Fetch main (the base to compare against)
  #       run: git fetch --no-tags --depth=1 origin main
  #
  #     - name: Check migration versions (no duplicates, newest-last)
  #       env:
  #         BASE_REF: FETCH_HEAD
  #       run: node scripts/check-migrations.mjs
