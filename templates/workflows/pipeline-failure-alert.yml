name: Pipeline failure alert

# ══════════════════════════════════════════════════════════════════════════════
# Post-merge failures must be loud — ported near-verbatim from a production
# deploy-failure-alert.yml, born from the 2026-07-09 incident: a PR's CI going
# green is SEPARATE from the post-merge prod deploy, and the deploy failed in
# the Actions tab for hours with nothing surfacing it. This reacts to a watched
# workflow finishing with `failure` on main and opens (or comments on) ONE
# deduplicated GitHub issue, @mentioning and assigning the repo owner so the
# alert actually reaches a human.
#
# STACK-NEUTRAL: pure actions/github-script + context.repo.owner — zero new
# secrets, zero placeholders, and decoupled via workflow_run (no edits to the
# watched workflows needed). Two operational requirements:
#   • workflow_run reads THIS FILE on the DEFAULT branch — it only fires once
#     merged to main; you cannot exercise it from a feature branch
#     (docs/LESSONS.md).
#   • Issue creation needs a writable token: keep the explicit
#     `permissions: issues: write` below, and if your org restricts it, set
#     repo Settings → Actions → General → Workflow permissions to
#     "Read and write permissions".
#
# Interaction with the deploy template's preflights: this fires only on a
# FAILED conclusion — a preflight that skips-green produces no failure event,
# so after your first successful deploy, flip deploy-on-green.yml's preflights
# to their fail-loud variants or this alert is blind to half-deploys.
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_run:
    # Watch list — EDIT ME. Each entry must match a watched workflow's top-level
    # `name:` exactly. Ships watching the kit's deploy template; uncomment or
    # add any post-merge workflow whose failure should page you (one per line).
    workflows:
      - 'Deploy (prod)'
      # - 'DB Backup'
      # - 'CI'
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    name: Open an issue on pipeline failure
    # Only failures on main alert — a red run on a feature branch is the PR
    # author's normal feedback loop, not an outage.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const owner = context.repo.owner
            const repo = context.repo.repo
            // The stable title IS the dedupe key — change it and you fork a second
            // issue instead of commenting on the existing one. One issue per watched
            // workflow (run.name), regardless of how many runs fail.
            const title = `🚨 ${run.name} is failing on main`
            const body = [
              `**${run.name}** run [#${run.run_number}](${run.html_url}) finished with \`failure\` on \`${run.head_branch}\` (commit \`${run.head_sha.slice(0, 7)}\`).`,
              '',
              'Whatever this workflow deploys, backs up, or safeguards did **not** happen.',
              '',
              `Investigate the failing job: \`gh run view ${run.id} --log-failed\``,
              '',
              // @mention the repo owner so the notification reason is "mention"
              // (delivered + emailed even under a "Participating and @mentions"
              // watch, and pushed by GitHub Mobile) rather than "subscribed" —
              // which a solo owner can silently miss. Repeated on EVERY comment so
              // a still-failing pipeline keeps nudging instead of going quiet after
              // the first (missed) issue.
              `cc @${owner} — this pipeline is broken on main until resolved.`,
            ].join('\n')
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const existing = open.data.find((i) => i.title === title && !i.pull_request)
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body })
              core.info(`Commented on #${existing.number}`)
            } else {
              // assignees:[owner] adds the "assign" notification reason and keeps
              // the owner subscribed, so later comments on this same issue also
              // reach them.
              const created = await github.rest.issues.create({ owner, repo, title, body, assignees: [owner] })
              core.info(`Opened #${created.data.number}`)
            }
