name: Cron health check

# ══════════════════════════════════════════════════════════════════════════════
# Scheduler-effect monitor — INERT template (activate at bootstrap:
# `git mv templates/workflows/cron-health.yml .github/workflows/`).
#
# ⚠ Supabase/Postgres (pg_cron + pg_net) EXAMPLE of a portable pattern — swap
# the query, keep the chassis. THE GENERAL LAW: a scheduler's success signal
# does not cover the work it triggers. pg_cron reports a run "succeeded" as long
# as the SQL ran — but the HTTP call that SQL makes can still fail, and that
# failure is otherwise SILENT. That's exactly how a real 2026-07-09 morning
# push stayed broken all day: the job ran every minute but the function returned
# 403 (wrong shared secret) / 404 (function never deployed) and nobody knew.
# Monitor the downstream EFFECT of a scheduled job, with a blip threshold and a
# status-code → cause hint table — whatever your scheduler is.
#
# UNIVERSAL SKELETON: ~15-min off-hour cron + workflow_dispatch, preflight-skip-
# green, a READ-ONLY effect probe with a sustained-failure threshold, then the
# open/update-deduped-issue + @mention/assign chassis. STACK-SPECIFIC (fenced
# below): the SQL against net._http_response + cron.job_run_details — substitute
# your platform's effect log (job queue dead-letters, downstream request logs,
# a heartbeat row the job is supposed to touch, …).
#
# This catches SUSTAINED failures (a job down for a while), not a single blip —
# which is what matters for an always-on cron; Actions' best-effort schedule is
# fine for that.
#
# Config: reuses the Secret BACKUP_DATABASE_URL (see backup-cron.yml for the
# pooler/IPv4 gotchas). Until it is set the job runs green but SKIPS — correct
# here, since this is a monitor: an unconfigured fork is never red.
#
# WHO is paged: the ALERT_PAGE_TO repository variable (logins or org/team,
# comma-separated; not a secret) when set; else the repository owner when that
# is a person. On an org-owned repo with no variable set, a failure still files
# the issue, which says "Nobody was paged", and the run FAILS — an @mention of an
# organization notifies nobody (see pipeline-failure-alert.yml).
#
# NOTE: scheduled workflows only run from the DEFAULT branch (main). Trigger
# manually (workflow_dispatch) to test.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '4,19,34,49 * * * *' # ~every 15 min, off the top of the hour to dodge Actions load
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Check scheduled-job health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight — is the DB URL configured?
        id: pre
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::BACKUP_DATABASE_URL not set — skipping cron health check."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # STACK-SPECIFIC: pg_cron/pg_net effect probe. Swap this block for your
      # scheduler's effect log; keep the contract: read-only, a blip threshold,
      # and a `failing=true|false` + multiline `report` output.
      # ════════════════════════════════════════════════════════════════════════
      # The DB URL carries the password — keep it in env, never inline / never with
      # `set -x`.
      - name: Query recent cron failures
        id: check
        if: steps.pre.outputs.configured == 'true'
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          # Window: last 30 min. HTTP failures need >=3 (a minute cron fails ~30x in
          # 30 min when broken, ~0 when healthy — 3 cleanly ignores a one-off blip).
          # Any FAILED pg_cron run counts. Assumes pg_net is used ONLY by the crons,
          # so any sustained non-2xx == a cron failing; narrow the WHERE if not.
          report=$(psql "$PGURL" -At -F '|' <<'SQL'
          with http as (
            select coalesce(status_code::text, 'error') as code, count(*) n
            from net._http_response
            where created > now() - interval '30 minutes'
              and (status_code is null or status_code < 200 or status_code >= 300)
            group by 1 having count(*) >= 3
          ),
          runs as (
            select j.jobname, count(*) n
            from cron.job_run_details rd
            join cron.job j on j.jobid = rd.jobid
            where rd.start_time > now() - interval '30 minutes' and rd.status = 'failed'
            group by 1
          )
          select 'http:' || code, n from http
          union all
          select 'cron:' || jobname, n from runs;
          SQL
          )
          echo "$report"
          if [ -n "$report" ]; then
            echo "failing=true" >> "$GITHUB_OUTPUT"
            {
              echo "report<<REPORT_EOF"
              echo "$report"
              echo "REPORT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failing=false" >> "$GITHUB_OUTPUT"
          fi
      # ════════════════════════════════════════════════════════════════════════
      # END STACK-SPECIFIC — the issue chassis below is universal.
      # ════════════════════════════════════════════════════════════════════════

      - name: Open/update a cron-health issue
        if: steps.pre.outputs.configured == 'true' && steps.check.outputs.failing == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
          ALERT_PAGE_TO: ${{ vars.ALERT_PAGE_TO }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            // ── WHO THIS ALERT PAGES ── identical in every alert template (scripts/check_alert_pages.py
            // runs each copy). An @mention of an ORGANIZATION notifies nobody and an organization
            // cannot be assigned, so the repository owner is never paged blindly. In order: the
            // ALERT_PAGE_TO repository variable (logins or org/team, comma- or space-separated);
            // else the owner, when the owner is a person. When neither applies the issue is still
            // filed, says "Nobody was paged", and the run FAILS: a page that reaches nobody must
            // not look delivered.
            async function alertRecipients() {
              const { owner, repo } = context.repo
              const names = (process.env.ALERT_PAGE_TO || '').split(/[\s,]+/).filter(Boolean).map((n) => n.replace(/^@/, ''))
              // A login, or an org/team slug. Nothing else is ever embedded after an `@`.
              const mentionable = /^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\/[A-Za-z0-9][A-Za-z0-9._-]{0,99})?$/
              const rejected = names.filter((n) => !mentionable.test(n))
              const logins = [...new Set(names.filter((n) => mentionable.test(n)))]
              if (logins.length) return { logins, whose: 'ALERT_PAGE_TO', rejected }
              let ownerType
              try {
                ownerType = (await github.rest.repos.get({ owner, repo })).data.owner.type
              } catch (e) {
                core.warning(`could not read who owns ${owner}/${repo}: ${e.message}`)
                return { logins: [], whose: 'this run could not read who owns the repository. Set the ALERT_PAGE_TO repository variable to the logins that should be paged', rejected }
              }
              if (ownerType === 'User') return { logins: [owner], whose: 'the repository owner', rejected }
              return { logins: [], whose: 'the repository owner is an organization, which an @mention does not notify. Set the ALERT_PAGE_TO repository variable to the logins that should be paged', rejected }
            }
            function pageLine({ logins, whose }, what) {
              if (!logins.length) return `**Nobody was paged:** ${whose}.`
              return `cc ${logins.map((l) => '@' + l).join(', ')} (${whose}) — ${what}`
            }
            // Assign whoever the page names (the "assign" reason keeps them subscribed to later
            // comments), then fail the run if the page named nobody or the variable was malformed.
            async function page(issue_number, { logins, whose, rejected }) {
              const { owner, repo } = context.repo
              const people = logins.filter((l) => !l.includes('/')) // a team is mentioned, never assigned
              if (people.length) {
                try {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: people })
                } catch (e) { // e.g. not a collaborator: the @mention is the page, this is extra
                  core.warning(`#${issue_number}: could not assign ${people.join(', ')}: ${e.message}`)
                }
              }
              if (rejected.length) core.setFailed(`ALERT_PAGE_TO names ${JSON.stringify(rejected)}, which is not a GitHub login or org/team`)
              if (!logins.length) core.setFailed(`#${issue_number}: this alert paged NOBODY — ${whose}.`)
            }
            // ── end WHO THIS ALERT PAGES ──
            // The stable title IS the dedupe key — change it and you fork the issue.
            const title = '🚨 Scheduled cron jobs are failing'
            const recipients = await alertRecipients()
            // Status-code → likely-cause hints: turn a raw code into the first
            // debugging move. Extend with the codes YOUR functions emit.
            const hint = {
              '403': 'shared-secret mismatch — the secret the cron sends must match the function env',
              '404': 'the target function is not deployed, or its URL setting is wrong',
              '401': 'auth rejected by the function',
              error: 'the request never got a response (network/timeout)',
            }
            const rows = (process.env.REPORT || '')
              .trim()
              .split('\n')
              .filter(Boolean)
              .map((l) => {
                const [label, n] = l.split('|')
                if (label.startsWith('http:')) {
                  const code = label.slice(5)
                  return `- **${n}** HTTP \`${code}\` response(s) in the last 30 min — ${hint[code] || 'non-2xx'}`
                }
                return `- cron job \`${label.slice(5)}\` had **${n}** failed run(s) in the last 30 min`
              })
            const body = [
              'The cron health check found scheduled jobs failing:',
              '',
              ...rows,
              '',
              'These jobs report "succeeded" as long as their trigger runs — the downstream call can still fail, so this is otherwise silent. Check `net._http_response` and `cron.job_run_details` in the SQL editor.',
              '',
              // @mention + assign a person so this reaches them even under a
              // "Participating and @mentions" watch (see pipeline-failure-alert.yml).
              pageLine(recipients, 'a scheduled job is failing silently.'),
            ].join('\n')
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const existing = open.data.find((i) => i.title === title && !i.pull_request)
            let number
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body })
              number = existing.number
              core.info(`Updated #${number}`)
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body })
              number = created.data.number
              core.info(`Opened #${number}`)
            }
            await page(number, recipients)
