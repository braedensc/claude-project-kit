name: PR conflict monitor

# ══════════════════════════════════════════════════════════════════════════════
# Standing merge-conflict monitor — INERT template (activate at bootstrap:
# `git mv templates/workflows/pr-conflict-monitor.yml .github/workflows/`).
#
# The hole this closes: the Stop hook's DIRTY gate (.claude/hooks/stop-pr-check.py)
# catches a conflicted PR only at turn-end, only in the session that owns the
# branch. A PR that becomes CONFLICTING *after* the session ends — because main
# moved — is invisible: GitHub can't build the merge ref, the required PR CI
# never runs, and side checks (CodeQL, previews) can still report green. This
# monitor watches open PRs on a schedule and flags conflicts the moment they
# appear, using the same open/update-with-@mention chassis as the other monitors.
#
# Mechanics: one GraphQL call lists open non-draft PRs with their computed
# `mergeable` state. CONFLICTING → add a `conflict` label + post ONE comment with
# the canonical rebase recipe, cc/assign the owner. Back to MERGEABLE → remove
# the label, so a NEW conflict later re-alerts. The label IS the dedupe key —
# one comment per conflict episode, no nag loop.
#
# TIER 1 (default, active): the comment tells the human the fix and the exact
# @claude reply that hands it off. TIER 2 (full-auto, commented out below): the
# monitor posts the @claude comment itself on PRs opted in via an `auto-rebase`
# label — read its caveats before uncommenting; they are the design.
#
# NOTE: scheduled workflows only run from the DEFAULT branch (main). Trigger
# manually (workflow_dispatch) to test. Zero new secrets/vars in Tier 1.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '11,41 * * * *' # ~every 30 min, off the top of the hour to dodge Actions load
  workflow_dispatch:

permissions:
  contents: read
  issues: write # labels + comments on PRs go through the issues API
  pull-requests: write

jobs:
  scan:
    name: Scan open PRs for conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label + comment on conflicted PRs
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const LABEL = 'conflict'

            // Ensure the label exists (idempotent) — auto-managed, humans shouldn't need
            // to pre-create it for the first run to work.
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'd93f0b',
                description: 'Merge conflicts with main (auto-managed by pr-conflict-monitor)',
              })
            } catch (e) {
              if (e.status !== 422) throw e // 422 = already exists; anything else is real
            }

            // One GraphQL call for everything. `mergeable` is computed LAZILY: GitHub
            // starts the computation when someone asks. UNKNOWN therefore means "still
            // computing" — treat it as skip-this-tick (the next run, ~30 min later,
            // reads the settled answer). Never retry-loop on UNKNOWN.
            // first: 100 is plenty for a small team; add pagination if you outgrow it.
            const result = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(states: OPEN, first: 100) {
                    nodes {
                      number
                      isDraft
                      mergeable
                      headRefName
                      labels(first: 100) { nodes { name } }
                    }
                  }
                }
              }`, { owner, repo })

            const newlyConflicted = []
            for (const pr of result.repository.pullRequests.nodes) {
              if (pr.isDraft) continue // drafts aren't mergeable anyway; don't nag WIP
              const labels = pr.labels.nodes.map((l) => l.name)
              const hasLabel = labels.includes(LABEL)

              if (pr.mergeable === 'CONFLICTING' && !hasLabel) {
                // New conflict episode: label (the dedupe key) + ONE comment.
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: [LABEL],
                })
                // Note on the suggested reply below: this monitor authors comments with
                // the default GITHUB_TOKEN, and GITHUB_TOKEN-authored comments NEVER
                // fire other workflows' issue_comment events (GitHub's anti-recursion
                // design) — so the literal '@claude' text here cannot trigger
                // claude.yml by itself. Only a HUMAN posting that reply triggers it.
                // That same fact is why Tier 2 (below) needs a PAT/App token.
                const body = [
                  `\`${pr.headRefName}\` has **merge conflicts** with \`main\` (mergeable = CONFLICTING).`,
                  '',
                  'While conflicted, GitHub cannot build the merge ref, so the **required PR CI never runs** — side checks (CodeQL, previews) can still look green. Do not mistake that for a passing PR.',
                  '',
                  'Fix (the canonical recipe):',
                  '',
                  '```',
                  'git fetch origin main && git rebase origin/main',
                  '# resolve conflicts, then:',
                  'git push --force-with-lease',
                  `gh pr checks ${pr.number} --watch`,
                  '```',
                  '',
                  'Or hand it off — reply on this PR:',
                  '',
                  '> @claude rebase this PR onto latest main, resolve conflicts, push with --force-with-lease, then watch CI',
                  '',
                  // @mention + assign so this reaches the owner even under a
                  // "Participating and @mentions" watch (see deploy-failure-alert.yml).
                  `cc @${owner} — this PR cannot merge and its required CI is not running.`,
                ].join('\n')
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
                try {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees: [owner] })
                } catch (e) {
                  core.info(`could not assign @${owner} on #${pr.number}: ${e.message}`)
                }
                newlyConflicted.push(pr.number)
                core.info(`#${pr.number}: CONFLICTING — labeled + commented`)
              } else if (pr.mergeable === 'MERGEABLE' && hasLabel) {
                // Conflict resolved: drop the label so a FUTURE conflict re-alerts.
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: LABEL,
                })
                core.info(`#${pr.number}: mergeable again — label removed`)
              } else if (pr.mergeable === 'UNKNOWN') {
                core.info(`#${pr.number}: mergeability still computing — skipping this tick`)
              }
            }
            // Consumed by the (commented-out) Tier 2 step; harmless while Tier 2 is off.
            core.setOutput('newly_conflicted', JSON.stringify(newlyConflicted))

      # ── TIER 2 (FULL-AUTO, OPT-IN — COMMENTED OUT ON PURPOSE) ────────────────────
      # Uncomment to let the monitor itself post the @claude rebase request on PRs
      # that carry an `auto-rebase` label (per-PR opt-in). Read the caveats first —
      # they are the design, not fine print:
      #
      #   • REQUIRES A PAT OR GITHUB-APP TOKEN (repo secret, e.g. CLAUDE_TRIGGER_TOKEN,
      #     with issues/PR write on this repo). Comments authored with the default
      #     GITHUB_TOKEN never trigger other workflows' issue_comment events —
      #     GitHub's anti-recursion design — so without a PAT the '@claude' comment
      #     would sit there doing nothing. The token's user must also pass claude.yml's
      #     actor checks. Setup: gh secret set CLAUDE_TRIGGER_TOKEN
      #   • FORCE-PUSH HAZARD: the rebase ends in a force-push to a branch that a live
      #     local worktree session may still hold (the kit's parallel-session model —
      #     docs/COLLABORATION.md). --force-with-lease limits the blast radius, but the
      #     local session still ends up behind a rewritten branch. Hence per-PR opt-in
      #     via the label — never repo-wide, never on by default.
      #   • THE AUTOMATION MUST NEVER MERGE. Conflict resolution is semantic judgment:
      #     it stops at push + CI watch, then a human reviews and a human merges (the
      #     kit's never-merge rule — enforced locally by the hooks, which CANNOT reach
      #     this workflow, so the prompt itself must stay merge-free).
      #
      # - name: "Tier 2: dispatch @claude on auto-rebase-labeled conflicts"
      #   if: steps.scan.outputs.newly_conflicted != '[]'
      #   uses: actions/github-script@v7
      #   with:
      #     github-token: ${{ secrets.CLAUDE_TRIGGER_TOKEN }}
      #     script: |
      #       const owner = context.repo.owner
      #       const repo = context.repo.repo
      #       const numbers = JSON.parse('${{ steps.scan.outputs.newly_conflicted }}')
      #       for (const issue_number of numbers) {
      #         const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number })
      #         const optedIn = pr.labels.some((l) => l.name === 'auto-rebase')
      #         if (!optedIn) continue // Tier 2 touches ONLY labeled PRs
      #         await github.rest.issues.createComment({
      #           owner, repo, issue_number,
      #           body: '@claude rebase this PR onto latest main, resolve conflicts, push with --force-with-lease, then watch CI. Do not merge.',
      #         })
      #         core.info(`#${issue_number}: dispatched @claude auto-rebase`)
      #       }
