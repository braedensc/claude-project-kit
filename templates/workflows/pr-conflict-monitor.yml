name: PR conflict monitor

# ══════════════════════════════════════════════════════════════════════════════
# Standing merge-conflict monitor — INERT template (activate at bootstrap:
# `git mv templates/workflows/pr-conflict-monitor.yml .github/workflows/`).
#
# The hole this closes: the Stop hook's DIRTY gate (.claude/hooks/stop-pr-check.py)
# catches a conflicted PR only at turn-end, only in the session that owns the
# branch. A PR that becomes CONFLICTING *after* the session ends — because main
# moved — is invisible: GitHub can't build the merge ref, the required PR CI
# never runs, and side checks can still report green. Detection alone is not
# enough either: with parallel sessions, a person becomes the only bridge from
# "detected" to "resolved". So a conflict STARTS A FIX.
#
# The logic is scripts/pr_conflict.py — the same file the kit runs on itself,
# one marker grammar, one selftest in CI. Per new conflict episode:
#   • budget left (3 automated attempts per PR, lifetime) → label + a `request`
#     comment. Exactly one of two things answers it, chosen by who owns the PR:
#       - a LOCALLY spawned session's PR → the conflict waker, a LaunchAgent on
#         the machine that holds the worktree (scripts/pipeline_conflict_waker_setup.py
#         installs it), wakes a capped session there;
#       - a DISPATCHER's PR → the Stage E bounce driver sends it back to the
#         session's own tracker thread, inside its sandbox.
#     Both merge main, resolve, push and watch CI. Neither merges or approves.
#   • no ack in 15 min, no result in 2 h, or a result while GitHub still says
#     CONFLICTING → ESCALATE once: @mention + assign the owner. Budget spent, or
#     a fork → page straight away, never request.
#
# With neither answerer installed, every request becomes that page 15 minutes
# later — the old behaviour, never silence. A project that runs claude.yml can
# still hand a conflict off by hand: reply `@claude merge main into this branch,
# resolve, push, watch CI` on the PR. The comment itself carries the manual recipe.
#
# THIS WORKFLOW NEVER MERGES, approves, rebases or pushes, and writes no label but
# `conflict` (the selftest asserts it — the local hooks cannot reach a runner).
# The label is the dedupe key and clears itself when the PR is mergeable again;
# closed PRs and drafts still carrying it are swept each run. A PR whose
# mergeability never settles fails the run (contract §13).
#
# Requires scripts/pr_conflict.py and scripts/pipeline_dispatch_local.py at the
# default branch (both ship with the kit). Zero new secrets. Scheduled runs only
# fire from the default branch; use workflow_dispatch to test.
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *' # every 20 min: the ack deadline is only as prompt as the next tick
  workflow_dispatch:

permissions:
  contents: read
  issues: write # labels + comments on a PR go through the issues API
  pull-requests: write

# Serialize rather than cancel: a cancelled run could die between "add label" and
# "post comment", leaving the dedupe key set with nothing explaining it.
concurrency:
  group: pr-conflict-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan open PRs for conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default-branch copy of the script (push/schedule/dispatch never check
      # out PR code), and no credential left in .git — this job never pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Request fixes, escalate stalled ones, clear stale labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pr_conflict.py monitor
