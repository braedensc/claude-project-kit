name: Hooks change guard

# The label gate, in a workflow of its own (KIT-317). It used to be the last job of ci.yml, and
# ci.yml ran on `labeled` so that the gate would re-judge when the owner added the label: which
# also re-ran every battery in "Kit checks" (about fifteen minutes) to re-judge one job. Here a
# label event runs only this, so a label turns the check green in seconds. The job name is
# unchanged, so the required status check "Hooks change guard" is the same context.
#
# Nothing else about the gate moved: it judges the PR against the default branch's tip, runs the
# default branch's copy of scripts/check_grader_paths.py, and reads who applied the label.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Server-side backstop for hook self-protection (docs/SECURITY.md; ported from
  # a production build's audit job). Local self-protection constrains only
  # sessions that run the hook — a PR authored anywhere else (another clone, the
  # GitHub web UI, an @claude workflow) never meets it. So a PR that changes a
  # GRADER path must not land unnoticed: it has to carry an explicit
  # `hooks-change` label. The gated set is the guard machinery
  # (.claude/hooks/**, .claude/settings*.json), the CI workflows that gate the PR
  # itself (.github/workflows/**), the graders those workflows run
  # (scripts/check_*.py) together with the dispatch path they import
  # (scripts/pipeline_*.py, scripts/jsonschema_mini.py) and the
  # templates/workflows/pipeline-*.yml sources they are synced from, and — when a
  # project has opted into the agentic delivery pipeline — `delivery.json` plus
  # everything in its `autonomy.riskPaths`, read from the default branch's tip, never
  # the head (a head that could shorten its own riskPaths would be grading its own
  # homework) nor a base the PR names (its author could have pushed it). The
  # authoritative list is FLOOR in scripts/check_grader_paths.py, whose selftest
  # asserts every file in the covered directories is gated or explicitly excused.
  # Same job, same label as before: one flag, not a second taxonomy to keep in sync.
  # Operational notes (learned in production):
  #   - the `hooks-change` label must EXIST in the repo before this job's first
  #     run can pass on a guarded PR (gh label create hooks-change …);
  #   - adding/removing the label re-runs the check via the labeled/unlabeled
  #     trigger types of this workflow; if a run ever wedges, an empty commit gives a
  #     clean re-run;
  #   - this flag only becomes a real gate once branch protection requires a
  #     review (required_approving_review_count >= 1, owner-set in the GitHub
  #     UI) so a human actually sees it. PR-only — a push to main has no label
  #     context;
  #   - HEAD CONTEXT: this job runs from the PR's own checkout, so a PR can edit
  #     the workflow and the script that gate it. The default-branch reads above close
  #     the config half of that hole, not the code half. The property "a green
  #     check can never be produced by the code under review" needs
  #     `pull_request_target` (base-ref workflow) PLUS a required review —
  #     owner-set, and deliberately not claimed until both are in place.
  hooks-change-guard:
    name: Hooks change guard
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    # `issues: read` is what lets the job ask WHO applied the label (the PR
    # events API). Without it the applier is unknowable and the gate fails closed.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the 'hooks-change' label to edit grader paths
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Judge the PR against the default branch's tip, never the base it names:
          # that base could be a branch its author pushed, with its own gate or a shorter
          # riskPaths, and retargeting a PR re-runs nothing (KIT-410). The gate, the diff
          # and delivery.json all come from there.
          if ! BASE_SHA=$(git rev-parse --verify "origin/$DEFAULT_BRANCH^{commit}"); then
            echo "::error::cannot read origin/$DEFAULT_BRANCH, so nothing can be judged"
            exit 1
          fi
          export BASE_SHA
          # Run the default branch's revision of the gate, never the PR's own copy. A head
          # that can rewrite FLOOR — or delete the identity check below it — is
          # grading its own homework; this is the same rule the script already
          # applies to delivery.json, extended to the script itself. The fallback
          # covers only the commit that first introduces the file.
          gate="$RUNNER_TEMP/check_grader_paths.py"
          if ! git show "$BASE_SHA:scripts/check_grader_paths.py" > "$gate" 2>/dev/null; then
            echo "::notice::base has no grader script yet — using the head copy"
            cp scripts/check_grader_paths.py "$gate"
          fi
          python3 "$gate"
