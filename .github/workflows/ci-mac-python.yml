name: CI on the Mac's Python

# KIT-653. Every job and hook on the owner's Mac runs /usr/bin/python3, which is 3.9.6. Kit
# checks runs the Ubuntu runner's Python (3.12) and "CI on the newest image" runs the newest
# 3.x, so before this job nothing in CI ran 3.9: a PR using anything newer passed every check,
# merged, and then broke the live jobs. A GitHub macOS runner has Apple's Python at the same
# path and version, so this job runs the batteries on it.
#
# It is a NEW workflow with its own job name on purpose: "Kit checks" is a required status
# context, and renaming or matrixing it would leave every PR waiting forever. This job is NOT
# required until the owner adds it (docs/TESTING.md, "Which Python each job runs"); a failure
# turns the PR red. No `continue-on-error`: a failure that succeeds tells nobody.
#
# KIT-945. One job ran every battery one after another and took 28m31s and 29m38s of its 30
# minutes, then was cancelled at the limit on two PRs while running test:acceptance-setup, so the
# batteries after it got no run on the Python the Mac runs. It is five parallel shard jobs now,
# from the lists in scripts/ci_shards.py, and a fan-in job that keeps the old name. The fan-in
# fails unless every shard succeeded: a job whose needs failed is skipped, and a skip can read
# as a pass.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  mac-python-shards:
    name: Kit checks (Python 3.9, the Mac's) shard ${{ matrix.shard }}/5
    runs-on: macos-15
    # 20: five shards of the batteries, each a fifth of the work. Set from the measured runs in
    # docs/TESTING.md, "Job limits and what to do near one".
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The npm scripts call `python3`, and on this runner the PATH may offer a newer one. Put a
      # link to Apple's /usr/bin/python3 first, then ASSERT it: the job never goes green on the
      # wrong Python.
      - name: Make python3 the Mac's Python, and prove it
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/mac-python-bin"
          mkdir -p "$shim"
          ln -sf /usr/bin/python3 "$shim/python3"
          echo "$shim" >> "$GITHUB_PATH"
          PATH="$shim:$PATH"
          got="$(python3 -V 2>&1)"
          want="$(/usr/bin/python3 -V 2>&1)"
          echo "python3 on the PATH: $got ($(command -v python3))"
          echo "/usr/bin/python3:    $want"
          case "$got" in "Python 3.9"*) ;; *) echo "::error::python3 is '$got', not Python 3.9"; exit 1;; esac
          [ "$got" = "$want" ] || { echo "::error::python3 ('$got') is not /usr/bin/python3 ('$want')"; exit 1; }

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --user pyyaml
          npm ci

      # The compiled files go to a folder under RUNNER_TEMP, so the checkout stays clean. Shard 1
      # only: it is one pass over the whole tree.
      - name: Byte-compile every tracked Python file
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          python3 -V
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          git ls-files -z '*.py' | xargs -0 python3 -m py_compile
          echo "compiled $(git ls-files '*.py' | wc -l | tr -d ' ') files"

      # KIT-659. The scripts Kit checks runs bare over the real tree (runner pin, workflow calls,
      # schemas, placeholders, delivery config and the others) and the JSON and YAML parse. The
      # list is scripts/check_direct_checks.py; Kit checks fails when its own steps and that list differ.
      # Shard 1 only: they read the whole tree, not a battery.
      - name: Direct checks over the real tree
        if: matrix.shard == 1
        run: |
          python3 -V
          python3 scripts/check_direct_checks.py --run

      # This shard's share of the test:* batteries, one at a time, each with its own TMPDIR. The lists
      # are scripts/ci_shards.py, which fails CI when one is missing or in two shards.
      - name: This shard's selftest batteries, one at a time
        run: |
          python3 -V
          python3 scripts/check_temp_leaks.py --shard mac/${{ matrix.shard }}

  mac-python:
    name: Kit checks (Python 3.9, the Mac's)
    needs: [mac-python-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every Mac shard succeeded (a skipped or cancelled one is not a pass)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_shards.py fan-in --expect mac-python-shards
