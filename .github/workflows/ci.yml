name: CI

# The kit's own CI — the kit lints itself. Layer 3 of the 3-layer security model
# (docs/SECURITY.md). Distilled from a production build's ci.yml (live
# 2026-06-23 → 2026-07-03); the app-project version with lint/typecheck/test/e2e
# jobs lives at templates/workflows/ci.yml.
#
# The job `name:` IS the required-status-check context. Branch protection
# requiring "Kit checks" is set only AFTER this workflow's first green run on
# main — requiring a context before it has ever reported wedges every open PR
# (merge-THEN-require; see docs/LESSONS.md).

on:
  push:
    branches: [main]
  # Run on every PR regardless of base branch — so stacked PRs (base != main)
  # are gated too, not just PRs that target main directly. `labeled`/`unlabeled`
  # are included so "Hooks change guard" re-evaluates the moment a
  # `hooks-change` label is added or removed (the default PR activity types —
  # opened/synchronize/reopened — don't cover labels).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  kit-checks:
    name: Kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Hook battery (block/allow)
        run: python3 .claude/hooks/test_hooks.py

      - name: Validate all tracked JSON/YAML
        run: |
          python3 -m pip install --quiet pyyaml
          git ls-files '*.json' '*.yml' '*.yaml' | python3 -c '
          import json, sys, yaml
          bad = []
          for f in sys.stdin.read().split():
              try:
                  with open(f) as fh:
                      if f.endswith(".json"):
                          json.load(fh)
                      else:
                          list(yaml.safe_load_all(fh))
              except Exception as e:
                  bad.append(f + ": " + str(e))
          print("\n".join(bad) if bad else "all tracked JSON/YAML parse OK")
          sys.exit(1 if bad else 0)
          '

      - name: Placeholder integrity (used == documented)
        run: python3 scripts/check_placeholders.py

      - name: Definition-of-Ready gate selftest
        run: python3 scripts/check_ticket_dor.py --selftest

      # The kit ships no live delivery.json, so the validator is inert here by
      # design (contract §2: absent is OFF). --selftest is what has teeth in CI.
      - name: delivery.json validator selftest (contract §7)
        run: python3 scripts/check_delivery_config.py --selftest

      # Belt-and-braces: if a delivery.json ever appears in this repo it is a
      # mistake (§1 — the kit ships delivery.example.json only), and this run
      # would catch it as a validation failure rather than shipping it silently.
      - name: delivery.json validity (no-op unless one exists)
        run: python3 scripts/check_delivery_config.py

      - name: Block forbidden paths (planning/, real .env, key material)
        run: |
          FORBIDDEN=$(git ls-files \
            | grep -E '^planning/|(^|/)\.env|\.pem$|\.key$' \
            | grep -v -E '(^|/)\.env\.example$' \
            || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files are tracked in git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: secretlint (scan all tracked files)
        run: git ls-files -z | xargs -0 npx secretlint --secretlintrc .secretlintrc.json

  # This template is public and must stay project-neutral. This job fails on
  # absolute home paths and real email addresses in tracked files; the "don't
  # name another project" rule is a convention in CLAUDE.md, not enforced here.
  provenance-scan:
    name: Provenance scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No home paths or real emails in tracked files
        run: python3 scripts/check_provenance.py

  # Server-side backstop for hook self-protection (docs/SECURITY.md; ported from
  # a production build's audit job). Local self-protection constrains only
  # sessions that run the hook — a PR authored anywhere else (another clone, the
  # GitHub web UI, an @claude workflow) never meets it. So a PR that changes a
  # GRADER path must not land unnoticed: it has to carry an explicit
  # `hooks-change` label. The gated set is the guard machinery
  # (.claude/hooks/**, .claude/settings*.json), the CI workflows that gate the PR
  # itself (.github/workflows/**), and — when a project has opted into the
  # agentic delivery pipeline — `delivery.json` plus everything in its
  # `autonomy.riskPaths`, read from the PR's BASE sha (a head that could shorten
  # its own riskPaths would be grading its own homework). Same job, same label as
  # before: one flag, not a second taxonomy to keep in sync.
  # Operational notes (learned in production):
  #   - the `hooks-change` label must EXIST in the repo before this job's first
  #     run can pass on a guarded PR (gh label create hooks-change …);
  #   - adding/removing the label re-runs the check via the labeled/unlabeled
  #     trigger types above; if a run ever wedges, an empty commit gives a
  #     clean re-run;
  #   - this flag only becomes a real gate once branch protection requires a
  #     review (required_approving_review_count >= 1, owner-set in the GitHub
  #     UI) so a human actually sees it. PR-only — a push to main has no label
  #     context;
  #   - HEAD CONTEXT: this job runs from the PR's own checkout, so a PR can edit
  #     the workflow and the script that gate it. The base-sha reads above close
  #     the config half of that hole, not the code half. The property "a green
  #     check can never be produced by the code under review" needs
  #     `pull_request_target` (base-ref workflow) PLUS a required review —
  #     owner-set, and deliberately not claimed until both are in place.
  hooks-change-guard:
    name: Hooks change guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the 'hooks-change' label to edit grader paths
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_grader_paths.py
