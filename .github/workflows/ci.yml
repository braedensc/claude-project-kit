name: CI

# The kit's own CI — the kit lints itself. Layer 3 of the 3-layer security model
# (docs/SECURITY.md). Distilled from a production build's ci.yml (live
# 2026-06-23 → 2026-07-03); the app-project version with lint/typecheck/test/e2e
# jobs lives at templates/workflows/ci.yml.
#
# The job `name:` IS the required-status-check context. Branch protection
# requiring "Kit checks" is set only AFTER this workflow's first green run on
# main — requiring a context before it has ever reported wedges every open PR
# (merge-THEN-require; see docs/LESSONS.md).

on:
  push:
    branches: [main]
  # Run on every PR regardless of base branch — so a PR whose base is not main is
  # still checked (it also fails the "PR base" workflow: stacked PRs are not
  # allowed, docs/COLLABORATION.md). Not `labeled`/`unlabeled`: a label used to re-run this whole
  # file (about fifteen minutes of batteries) just to re-judge one job. "Hooks change guard" has
  # its own workflow now (hooks-change-guard.yml), so a label re-judges it in seconds (KIT-317).
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  kit-checks:
    name: Kit checks
    runs-on: ubuntu-24.04
    # 15: the leak sweeps (KIT-450) moved to their own job (KIT-617), so this runs the
    # selftests alone. docs/TESTING.md says what to do when a run nears the limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node for the secret scan, and nothing else yet: no npm cache, which the PR's own
      # lockfile would key.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # First, before any of the PR's code runs. Every later step can execute a file the PR
      # controls (a root yaml.py that `python3 -c` imports, npm's lifecycle scripts, an
      # .npmrc's node-options), and such code could change what a later scan sees. This step
      # runs the default branch's copy of the scanner with its rules, and installs the
      # secretlint packages its lockfile pins: never the PR's, nor those of the base the PR
      # names, which its author could have pushed (a retarget re-runs nothing). It scans what
      # would land and, on a PR, the head's own tree as well: a base can delete a head's file
      # from the merge, and retargeting to main brings it back. The scan reads every file as
      # git stores it and lists what it could not read
      # (scripts/check_secret_scan.py; KIT-400, KIT-401, KIT-410).
      - name: Secret scan (every tracked file, as git stores it)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/secret-scan"
          mkdir -p "$scan/tool"
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          trusted=$(git rev-parse FETCH_HEAD)
          git show "$trusted:package-lock.json" > "$scan/package-lock.json"
          git show "$trusted:.secretlintrc.json" > "$scan/.secretlintrc.json"
          if ! git show "$trusted:scripts/check_secret_scan.py" > "$scan/check_secret_scan.py" 2>/dev/null; then
            echo "::notice::the default branch has no scripts/check_secret_scan.py yet, so the PR's copy runs"
            cp scripts/check_secret_scan.py "$scan/check_secret_scan.py"
          fi
          python3 -I "$scan/check_secret_scan.py" --scanner-packages "$scan/package-lock.json" > "$scan/packages.txt"
          (cd "$scan/tool" && xargs npm install --prefix "$scan/tool" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund < "$scan/packages.txt")
          python3 -I "$scan/check_secret_scan.py" --scan --tool "$scan/tool" --config "$scan/.secretlintrc.json"
          if [ -n "$PR_HEAD" ]; then
            git fetch --no-tags --depth=1 origin "$PR_HEAD"
            python3 -I "$scan/check_secret_scan.py" --scan --tree "$PR_HEAD" --tool "$scan/tool" --config "$scan/.secretlintrc.json"
            # the PR's own commits as well, from the PR's base: a count of the newest commits is wrong
            # once the branch has merged the base into itself. Every miss is could-not-scan.
            if [ "${PR_COMMITS:-0}" -lt 1 ]; then
              echo "::error::COULD NOT SCAN the PR commits: GitHub gave no commit count"
              exit 2
            fi
            git fetch --no-tags --depth="$((PR_COMMITS + 1))" origin "$PR_HEAD" "$BASE_SHA"
            if [ "$(git rev-list --count "$BASE_SHA..$PR_HEAD")" -lt "$PR_COMMITS" ]; then
              echo "::error::COULD NOT SCAN the PR commits: fewer than $PR_COMMITS are in the range"
              exit 2
            fi
            python3 -I "$scan/check_secret_scan.py" --scan --history "$BASE_SHA..$PR_HEAD" --tool "$scan/tool" --config "$scan/.secretlintrc.json"
          fi

      - name: Hook battery (block/allow)
        run: python3 .claude/hooks/test_hooks.py

      # Characterization, not aspiration: fails only when the RECORDED result of
      # a GuardFall probe changes — a guard that started leaking, or one that was
      # hardened without updating the record and the two docs. See the file's
      # docstring and docs/SECURITY.md.
      - name: GuardFall bypass battery (recorded results still hold)
        run: python3 .claude/hooks/test_guard_bypass.py

      # The PR-base gate itself runs as its own workflow (pr-base.yml — so a
      # retarget re-runs it, and a stacked PR still gets every step here). Its
      # decision function is proven here too, so a push to main checks it.
      - name: PR base check selftest
        run: python3 scripts/check_pr_base.py --selftest

      # KIT-429. No workflow runs on a moving `-latest` image, so an upgrade is a choice made
      # in a PR. The one exception is ci-newest-image.yml, whose job is to run there.
      - name: Runner pin check (no workflow on a -latest image)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_runner_pin.py --selftest
          python3 scripts/check_runner_pin.py

      - name: Validate all tracked JSON/YAML
        run: |
          python3 -m pip install --quiet pyyaml
          git ls-files '*.json' '*.yml' '*.yaml' | python3 -c '
          import json, sys, yaml
          bad = []
          for f in sys.stdin.read().split():
              try:
                  with open(f) as fh:
                      if f.endswith(".json"):
                          json.load(fh)
                      else:
                          list(yaml.safe_load_all(fh))
              except Exception as e:
                  bad.append(f + ": " + str(e))
          print("\n".join(bad) if bad else "all tracked JSON/YAML parse OK")
          sys.exit(1 if bad else 0)
          '

      # Parsing proves a workflow is well-formed, not that it can START. A job
      # doing `uses: ./…` whose permissions are narrower than the callee declares
      # ends the whole RUN as `startup_failure` — no jobs, no annotations, no
      # check run, nothing in the PR's checks list. This is the one class of
      # workflow bug a checks list can never surface, and it is fully decidable
      # from the two files, so it is checked here rather than discovered live.
      # Runs immediately after the parse step, which is what installs pyyaml.
      - name: Reusable-workflow call contracts selftest
        run: python3 scripts/check_workflow_calls.py --selftest

      - name: Reusable-workflow calls in this repo can start
        run: python3 scripts/check_workflow_calls.py

      - name: Placeholder integrity (used == documented)
        run: python3 scripts/check_placeholders.py

      # A session copies the brief's escalation mark and finding block word for word, so a
      # brief that drifts from the notifier's or the finding job's own parser turns every
      # real escalation into silence (KIT-231). Judged with the readers' own code.
      - name: Session brief formats match their readers
        run: |
          python3 scripts/check_session_brief.py --selftest
          python3 scripts/check_session_brief.py

      - name: Definition-of-Ready gate selftest
        run: python3 scripts/check_ticket_dor.py --selftest

      # The vendored draft 2020-12 subset the schemas are held to. Its guarantee
      # — an unrecognized keyword is an error, never a silent no-op — is what
      # makes "the schema enforces this" a true statement.
      - name: Vendored JSON Schema validator selftest
        run: python3 scripts/jsonschema_mini.py --selftest

      # schemas/ ⇄ docs/PIPELINE-CONTRACT.md. Fails if §1 grows a field the
      # schema does not define (or vice versa), if delivery.example.json drifts
      # from the spec, or if the malformed shape /setup-board once emitted stops
      # being rejected. One definition, two renderings.
      - name: Schema ⇄ contract parity selftest
        run: python3 scripts/check_schemas.py --selftest

      # Belt to that braces: validates this repo's own instances outside the
      # selftest's fixtures, so a bad delivery.example.json fails even if the
      # selftest were somehow skipped.
      - name: Validate this repo's JSON documents against schemas/
        run: python3 scripts/check_schemas.py

      # The generation-side half: every producer of a schema'd document refuses
      # to WRITE a malformed one, rather than writing it and being told later.
      # Includes the two gates that live in workflow steps rather than in this
      # script — the review normalizer is extracted and executed, not grepped.
      - name: Generation-side gate selftest (contract §12, §14)
        run: python3 scripts/emit_document.py --selftest

      # The kit ships no live delivery.json, so the validator is inert here by
      # design (contract §2: absent is OFF). --selftest is what has teeth in CI.
      - name: delivery.json validator selftest (contract §7)
        run: python3 scripts/check_delivery_config.py --selftest

      # Belt-and-braces: if a delivery.json ever appears in this repo it is a
      # mistake (§1 — the kit ships delivery.example.json only), and this run
      # would catch it as a validation failure rather than shipping it silently.
      - name: delivery.json validity (no-op unless one exists)
        run: python3 scripts/check_delivery_config.py

      # Tier 0, the human-run local dispatcher. Also the drift check on the ONE
      # pin-key derivation: this script, the PreToolUse hook and
      # templates/workflows/pipeline-dispatch.yml must agree on
      # sha256(realpath(session root))[:16], or every pin silently reads as
      # absent and `/work` fails closed for a reason nobody can see.
      - name: Local dispatcher selftest (contract §2, §3)
        run: python3 scripts/pipeline_dispatch_local.py --selftest

      # The autonomy gates and the telemetry pipeline. Same posture as the two
      # above: inert in this repo (no delivery.json, no store), so the selftests
      # are what has teeth. Each asserts its own contract rows against synthetic
      # fixtures — §5/§11 for the two gates, §4/§10 for the collector.
      - name: Auto-approval gate selftest (contract §5, §11)
        run: python3 scripts/check_auto_approve.py --selftest

      - name: Auto-merge tier selftest (contract §11)
        run: python3 scripts/check_auto_merge.py --selftest

      # The gate in hooks-change-guard.yml ("Hooks change guard") runs the BASE copy of this script,
      # so its own logic is verified here on the head — gated set and, above all,
      # who is allowed to supply the acknowledging label.
      - name: Grader-path gate selftest (floor + label identity)
        run: python3 scripts/check_grader_paths.py --selftest

      # gh cannot verify TLS inside the sandbox (KIT-71): Go on darwin ignores
      # SSL_CERT_FILE and asks a keychain service the sandbox blocks. This is the
      # REST fallback sessions use instead; the selftest is offline and asserts,
      # among other things, that it still cannot merge.
      - name: GitHub REST fallback selftest (no merge capability)
        run: python3 scripts/gh_fallback.py --selftest

      # Stage E's local reviewer core (docs/adr/2026-09-05-…). Offline: asserts a
      # decline is never a clean green (§13/TOD-112), a malformed findings file is
      # unusable not silently smaller (§14), and the script builds no approve/merge/
      # label path — the same "cannot escalate" guarantee gh_fallback makes.
      - name: Stage E local reviewer selftest (comment-only, decline≠clean)
        run: python3 scripts/pipeline_review_local.py --selftest

      # Stage E's basis resolver (docs/adr/2026-09-05-…, decision 2 — "the snapshot
      # problem"). Offline: tier ordering (history > reconciler > live), tier 1 proven
      # immune to a post-delegation edit BY CONSTRUCTION (its signature accepts no live
      # issue), the edit-after-delegation flag computed from the live ticket regardless
      # of which tier answered, an honestly empty basis is not a crash, and the script
      # never constructs a Linear write mutation — read-only, like the reviewer it feeds.
      # Tier 2 reads only the snapshot writer's document, and a snapshot that was edited
      # before it was taken (or cannot say) never answers "unchanged".
      - name: Stage E basis resolver selftest (tier ordering, read-only against Linear)
        run: python3 scripts/pipeline_review_basis.py --selftest
      # Tier 2's writer (KIT-131), run by the bounce driver: a snapshot only for a session
      # a PERSON delegated, immutable for its session, its lag and any edit inside that lag
      # recorded (unknown is not "no"), an unreadable snapshot never re-taken as the live
      # ticket, one change notice per distinct live version, and commentCreate as its only
      # Linear mutation.
      - name: Stage E criteria snapshot selftest (person-delegated only, one notice, one mutation)
        run: python3 scripts/pipeline_criteria_snapshot.py --selftest
      # Stage E's poller (option 4): creates + delegates one review ticket per new pipeline
      # PR, reads the reviewer's answer back and publishes it. Offline: asserts the
      # sanitizer strips dispatcher routing tags and fence tokens, the ticket is never
      # parented, malformed/tampered/timed-out read-backs decline loudly, one comment and
      # one outcome per PR, the seen-set is written through so one PR's crash never costs
      # another its record (no second paid reviewer session), a credential shape in the
      # reviewer's text is withheld over the real publish path, and no approve/merge/label
      # path exists.
      - name: Stage E review poller selftest (sanitizer, decline paths, comment-only)
        run: python3 scripts/pipeline_review_poller.py --selftest
      # Stage E's finding poller (KIT-96 local backend): a session's pipeline-finding/1
      # comment becomes a backlog ticket, filed by the role account, forcing state,
      # provenance:agent, owner-subscribe; never ready, never a protected label, never an
      # assignee. Offline selftest asserts the parse, dedup, both flood caps, and shape.
      - name: Stage E finding poller selftest (create-shape, dedup, flood caps)
        run: python3 scripts/pipeline_finding_poller.py --selftest
      # The catch-up poller (KIT-47): a delegation the dispatcher never received is
      # re-prompted once, past Linear's retry ladder, under the session's own thread.
      # Offline selftest: every candidate rule, the floor's refusal, the gate, the
      # webhook's three states, the cap, the ledger and the thread backstop.
      - name: Stage E catch-up poller selftest (lost delegations, one re-prompt each)
        run: python3 scripts/pipeline_catchup_poller.py --selftest
      # The sweep (KIT-464): what a finished dispatcher run left on the role account goes.
      # Real folders and real git, the tracker and the process list stood in for: every
      # rule and refusal, a source it could not read removing nothing, the dry run, the
      # command line's refusals, and its only tracker calls two reads.
      - name: Sweep selftest (finished runs' leftovers go; open tickets and blind reads never)
        run: python3 scripts/pipeline_sweep.py --selftest
      # The look tool (KIT-323). Offline, a fake runner: the request refusals, the pinned command line and clean environment, the
      # record outside the worktree, the per-plan count, MCP, every profile rule. The live checks run only where sandbox-exec exists.
      - name: Look tool selftest (one browser check, locked sandbox, its own record)
        run: python3 scripts/pipeline_look.py --selftest
      # The sweep's installer (KIT-467). Offline, the machine stood in for: the config judged by the sweep's own loader,
      # the plist installed and never loaded, the dry run shown, the leftover row's pass, fail and could-not-measure.
      - name: Sweep installer selftest (installed, never loaded; leftover space checked)
        run: python3 scripts/pipeline_sweep_setup.py --selftest
      # The day planner (KIT-439, MVP 2 part 5b): the brief a read-only agent gets, and the checks
      # on every pick it makes. Offline, a pure function: ticket text fenced as data with every
      # directive and fence tag out of it, one answer block read and none of its prose kept, a
      # pick that fails dropped with a reason, hostile answers, a mutant for each rule.
      - name: Day planner selftest (fenced brief, one answer block, every pick checked)
        run: python3 scripts/pipeline_day_planner.py --selftest
      # The morning job (KIT-446, MVP 2 part 6b). Offline, the reader and the CLI stood in for: the
      # child's argv and environment pinned, only a setup token sent, an unusable answer the
      # queue's plan, a mutant for each rule.
      - name: Morning job selftest (inside the window, one tool-less call, every pick checked)
        run: python3 scripts/pipeline_morning.py --selftest
      # The status job (KIT-335, contract §16): one file of where every plan stands, for the
      # tech lead. Offline, both transports stood in for: fields only, a source that fails is
      # said and the file still written, in the words the heartbeat monitor reads.
      - name: Stage E status job selftest (fields only, a failed source said, never guessed)
        run: python3 scripts/pipeline_status_local.py --selftest
      # The watcher's first piece (KIT-514, contract §19): plain-code monitors over signals the
      # system already writes. Offline, GitHub and the usage file stood in for: each monitor's
      # four states, a blind source never reported clear, an unsafe rules file making the pass
      # blind and unable to redirect its output, fields only, GET only, and the source read to
      # prove it starts no process, opens no socket and writes one file.
      - name: Watcher monitors selftest (clear, flagged, blind or off; never quiet when blind)
        run: python3 scripts/pipeline_watcher_local.py --selftest
      # The watcher's one POST (KIT-556): a fixed read-only tracker query, in a file of its own. Offline:
      # one host, one query that is a constant with no variables, no mutation, no second query, no
      # redirect followed, the key in no error, and a failed query raised and never read as "nothing".
      - name: Watcher tracker selftest (one fixed read-only query; nothing else may be sent)
        run: python3 scripts/pipeline_watcher_tracker.py --selftest
      # The watcher's own install (KIT-517): its account, a root-owned folder, a manifest it checks every pass.
      # Offline, with a stand-in machine: one typed yes, nothing changed before it, a key never in a command
      # line or an output, a worker who can write the install is a failure, and what it writes passes the
      # watcher's own self-check.
      - name: Watcher setup selftest (one yes; the workers cannot edit the watcher)
        run: python3 scripts/pipeline_watcher_setup.py --selftest
      # The watcher's read-only copier (KIT-573): a root job that copies the workers' usage file into root's
      # folder. Offline, with hostile sources: a link, a file of another account, a second name, a pipe, an
      # oversize file and a folder others can write are each refused, the old copy removed, and no path the
      # rules did not name is ever opened.
      - name: Watcher copier selftest (a link, a stranger's file and an oversize file are refused)
        run: python3 scripts/pipeline_watcher_copy.py --selftest
      # The hold (KIT-515, contract section 20): the watcher's one power, and the owner's alone to
      # clear. Offline: absent is no hold, anything else that is not a valid hold holds, a later clean
      # pass never clears one, the owner's clear is refused in an agent's environment.
      - name: Hold selftest (a hold holds; only the owner clears it)
        run: python3 scripts/pipeline_hold.py --selftest
      # The validator's settings (KIT-533, contract section 23): plain on/off switches. Offline: absent,
      # invalid, unreadable or untrusted is every switch off, a file naming the safety system is
      # refused, and the loader has no write path.
      - name: Validator settings selftest (anything but a valid, trusted file is every switch off)
        run: python3 scripts/pipeline_validator_settings.py --selftest
      # The watcher's urgent page (KIT-519): its own way to the owner, not through the workers'
      # bridge. Offline, with a fake sender: sent once per change of answer, a failed page sent
      # again and never recorded as sent, cleared said once, the watcher's own silence paged, no
      # text from a ticket in a page, no credential in any file, two hosts and no others.
      - name: Watcher page selftest (a failed page is sent again; no credential leaks)
        run: python3 scripts/pipeline_watcher_page.py --selftest
      # The watcher's judge (KIT-516): a model that explains a flag, and can do nothing else. Offline, with
      # a fake runner: given fields and fenced data, its words checked by code, a failed judge said, its own
      # day cap, and a judge that says "clear" lowers and clears nothing.
      - name: Watcher judge selftest (it explains; it lowers, clears and holds nothing)
        run: python3 scripts/pipeline_watcher_judge.py --selftest
      # The working window (KIT-437, MVP 2 part 4): when the system may start new work. A pure
      # function, so the selftest stands in for the time and the machine's zone: Monday to
      # Saturday open and Sunday off, the next opening and the grace, a per-day override,
      # daylight saving in New York and Sydney, a window across midnight, a 24-hour window, a
      # start in the spring-forward gap, every config fault named, a mutant for each rule, and
      # the source read to prove it touches no file, environment variable, socket or clock.
      - name: Working window selftest (days, daylight saving, the grace, a mutant for each rule)
        run: python3 scripts/pipeline_window.py --selftest
      # The validator's evidence (KIT-534): layer 2 for a pull request at its own head. Offline, with
      # a stubbed gh: every check green and every required one run, Stage E's review full at this
      # exact head and worst-of across its comments, the acceptance check for a last piece, a clean
      # merge state; anything it cannot read is no.
      - name: Validator evidence selftest (no when it cannot tell; never PR text in its answer)
        run: python3 scripts/pipeline_validator_evidence.py --selftest
      # The validator's ledger (KIT-535, contract section 24): one row per decision, written by one
      # function. Offline: append-only and atomic, one verdict per head, an approval only when all three
      # layers pass, and a ledger that cannot be trusted gives no rows, never an empty list.
      - name: Validator ledger selftest (one writer; an unreadable ledger approves nothing)
        run: python3 scripts/pipeline_validator_ledger.py --selftest
      # The validator's verdict as the Validator check (KIT-540), posted by its own GitHub app.
      # Offline, against a stubbed code host: success only for an approval recorded at that
      # exact head, nothing for a head with no decision, a ledger it cannot read posts nothing,
      # a refused post holds in words, and no credential reaches an answer.
      - name: Validator check selftest (the ledger's decision, at its own head, as its own app)
        run: python3 scripts/pipeline_validator_check.py --selftest
      # The queue's order and limits (KIT-434, MVP 2 part 2b): what starts next. A pure function,
      # so the selftest stands in for everything it is given: priority, then the plan approved
      # first, then the plan's dependency order; an open blocker never starts; lanes in each
      # repository, a pull request holding its lane; the day's load, a hold and not a stop; each
      # runaway stop holding every start; every number the config's; a mutant for each rule.
      - name: Queue order selftest (priority, blockers, lanes, the day's load, the runaway stops)
        run: python3 scripts/pipeline_queue_order.py --selftest
      # The validator agent's brief and answer (KIT-536): code builds what the agent reads and reads
      # what it says. Offline, no model: a payload cannot close its fence, an over-cap diff is said,
      # the answer's grammar is closed, the reason is cleaned, and the agent can only hold.
      - name: Validator brief selftest (fenced input; a closed answer; it can only hold)
        run: python3 scripts/pipeline_validator_brief.py --selftest
      # The validator's hard limits (KIT-538): layer 1, plain code with no model. Offline, in a
      # temp folder: one case per rule and every reason reached; each fact read by the part of
      # the kit that owns it; the safety-system floor is never a switch; closed words only.
      - name: Validator limits selftest (pass or closed reasons; what it cannot tell fails)
        run: python3 scripts/pipeline_validator_limits.py --selftest
      # The usage runs (KIT-422, contract §17): the dispatcher's logs, and the Stage E and
      # idea-gate records beside them, read into runs. Offline, reading only, in a temp folder:
      # a run's spend is its share of its session's running totals, a crash is unpriced and
      # never zero, a conflict fix is told from a bounce, and hostile logs and message text
      # leave no trace in a run.
      - name: Stage E usage runs selftest (spend from totals, kinds from records, hostile logs)
        run: python3 scripts/pipeline_usage_runs.py --selftest
      # The usage job (KIT-422, contract §17): the runs counted into one file of what the pipeline
      # spent. Offline, with no network and no credential, in a temp folder only: the week is
      # unknown rather than guessed, a source it could not read is said, a file that does not
      # conform is never written, and no message text reaches the file or its output.
      - name: Stage E usage job selftest (the week, exit codes, refusals, fields only)
        run: python3 scripts/pipeline_usage_local.py --selftest
      # The queue's pool (KIT-433, MVP 2 part 2a): which tickets may start without the owner. A
      # pure function, so the selftest stands in for everything it is given: the owner by actor
      # in the history, never the dispatcher's user; a history or record it cannot read held and
      # said; a plan's pieces as they stood at the approval; an agent-filed ticket only within
      # its limits; a mutant for each rule; and no title or text in a verdict.
      - name: Queue pool selftest (the owner's work by actor, held and said, a mutant for each rule)
        run: python3 scripts/pipeline_queue_pool.py --selftest
      # The queue's reader (KIT-445): the tracker and three records read into one inputs file.
      # Offline, a stand-in tracker: a history whole or null, the caps, the key never printed.
      - name: Queue reader selftest (read-only, a history whole or not at all, routing, the caps)
        run: python3 scripts/pipeline_queue_read.py --selftest
      # The queue's starter (KIT-452): what may start now, and the ledger row before each start.
      # Offline, the reader stood in for: a closed window reads nothing, a failed read starts
      # nothing, a ledger it cannot count on refuses, a mutant for each rule.
      - name: Queue starter selftest (inside the window, the order's start list, the ledger first)
        run: python3 scripts/pipeline_queue_start.py --selftest
      # The queue's installer (KIT-456). Offline, every command stood in for; a mutant for each rule.
      - name: Queue installer selftest (the jobs' own loaders, no plist overwritten, nothing loaded)
        run: python3 scripts/pipeline_queue_setup.py --selftest
      # The day plan file (KIT-438, contract §18): the queue's decision as one file the stand-up
      # reads with no model between. Offline, files only in a temp folder: fields only, a reply
      # built from two fixed patterns, a document that does not conform never written.
      - name: Day plan selftest (fields only, fixed replies, never written unless it conforms)
        run: python3 scripts/pipeline_day_plan.py --selftest
      # Stage E's bounce driver (same ADR, decision 5, option 4). Offline, every read
      # and write stubbed and recorded: bounce numbers N-1/N/N+1 ⇒ bounce/bounce/exhaust,
      # the ledger row lands BEFORE the re-prompt is sent (a failed send is still spent,
      # and the PR is told), an unreadable or corrupt ledger is REFUSED rather than read
      # as zero, `exhaust` refuses unless the verdict is exhaust (never a label outside a
      # spent budget, never on a fork or a closed PR), only the base branch's REQUIRED
      # checks count (an unknown required set is not a trigger), a ticket named only by
      # the branch must own the PR in Linear's record, a non-pipeline branch is declined,
      # a terminal ticket is skipped with a reason, an absent committed delivery.json is
      # OFF and NAMED (§2/§13, never silent) while a broken one is said once on the PR,
      # a ticket with no agent-session thread gets the fallback fix ticket with its
      # [repo=name#branch] tag and push instruction, the sanitizer strips routing tags
      # and fence tags from every copied text, the ONLY label ever written is
      # agent:needs-human on exhaustion, and the source builds no merge/approve/auto-merge
      # path and launches no agent session.
      # Also the three owner corrections of 2026-09-06: the driver runs as the dispatcher's
      # role account under a system daemon, so ONE config file serves it and the poller
      # (their key spellings aliased, unknown keys ignored), a state dir inside a git
      # working tree is REFUSED and one outside the account's home warns, and the one-shot
      # `run` pass leaves a heartbeat on every path, isolates one PR's crash from the pass
      # and reports a deadline as PARTIAL rather than clean; the original ticket is named
      # by LINEAR'S attachment record before the branch name, whose fallback says why; and
      # the ledger stays the budget authority while the re-prompt carries a visible record
      # that can make the driver REFUSE but can never grant it a bounce.
      - name: Stage E bounce driver selftest (ledger-first re-prompt, one label, no merge)
        run: python3 scripts/pipeline_bounce_local.py --selftest
      # The human-action notifier (KIT-115): one ping per event that needs a person,
      # keyed on the escalation marks the pipeline already writes. Offline, every transport
      # stubbed: asserts the mark table matches the ADR and an informational note never
      # pages, an HTML-escaped (executor-neutralized) mark does NOT page so a session cannot
      # forge one, needs-human wins over blocked, build_message structurally cannot carry a
      # comment body (decision 2), the agent:blocked mapping is exactly decision 4's, a
      # credential value in the config and a state dir inside a worktree are both refused
      # with every config error reported in one pass, the three §13 states carry three
      # different exit codes, a corrupt seen-set refuses to run rather than re-paging, dry
      # run writes nothing, a heartbeat is left on the failing path, and no merge/approve/
      # state-change path exists. With reply_relay OFF (the default) the only tracker
      # mutation is one label; with it ON there is exactly one more, a thread reply that only
      # ever carries an owner's relayed reply (KIT-118). The relay half asserts: off means no
      # thread read and no new write; only an agent:blocked ping becomes a target; a second
      # chat account, a non-threaded message, a reply to a message the notifier did not send,
      # a bot post, an edit and a file share are each dropped; an oversize reply is dropped,
      # never truncated; the seventh relay in an hour is dropped; the target is the ticket AND
      # THREAD recorded when the ping went out — the thread the session's own mark sits in —
      # so a newer session on the same ticket never receives the answer, and a recorded thread
      # that is gone declines instead of falling back; decode and bracket-strip repeat to a
      # FIXED POINT, so a bracket hidden inside an entity cannot be glued back together, and
      # the result is re-checked before it is posted; pending is saved before the post, so a
      # replay posts once, a crash is named unconfirmed (exit 3) and a post that raised is
      # never retried; every failed thread read is exit 1, a ping that is not (or is no
      # longer) a relay target names itself once, and a pass that failed or declined only in
      # the relay never claims 'nothing to do, not a failure'; and a comment write anywhere
      # outside the relay path — including through a from-import — turns it red.
      - name: Human-action notifier selftest (marks, §13 states, label + relay-reply mutations)
        run: python3 scripts/pipeline_notify_local.py --selftest

      # The heartbeat monitor: the one job that READS the other three's heartbeats, which
      # until now nothing did. Offline, every file local and the tracker stubbed: asserts
      # each daemon's real heartbeat SHAPE is judged (the schema strings and filenames are
      # cross-checked against the three writers, so a renamed field turns this red rather
      # than silently reading as healthy), that a heartbeat this monitor cannot parse is
      # `unreadable` — a statement about the monitor, never a clean bill of health — that a
      # stale beat after the monitor missed its OWN schedule is NOT paged on (a sleeping
      # laptop would otherwise guarantee three false pages on every wake) while a missing,
      # failing or unjudgeable beat still is, that five identical bad passes post exactly
      # ONE comment and a recovery posts exactly one more, that a cooldown carries a
      # suppressed change instead of dropping it and never delays a recovery, that a problem
      # with no configured ticket is exit 3 rather than a clean green (§13), that an
      # undelivered page is not recorded as sent yet still advances the run clock (so a
      # tracker outage cannot silently disable staleness judgment), and that the file builds
      # exactly one tracker mutation — commentCreate — with no label, state, ticket or
      # pull-request write anywhere in it.
      - name: Heartbeat monitor selftest (one comment per incident, §13 exit codes)
        run: python3 scripts/pipeline_heartbeat_monitor.py --selftest

      # The notifier's installer (KIT-116). Offline, every transport stubbed, a real /bin/sh
      # standing in for the role account: every conf error in one pass (a first-error-wins
      # mutant turns it red), and each refusal by name — the invoking user as the role
      # account, the dispatcher's own SLACK_BOT_TOKEN name, the dispatcher's env file and
      # state root; run and attest refused under a model, and a model's dry run attempts no
      # sudo, makes no tracker request and records nothing; a planted token and key reach no
      # output and not the ledger, and the token meets only shell builtins; the ledger read
      # back by `status` in a fresh process; verify never writes and never raises; the
      # composed config accepted by the notifier's own loader and a broken one refused before
      # any write; the plist sources the env file like every Stage E daemon; the dry run
      # passes 0 and 3 and fails 1, 2 and 4; a redirect refused by the real transport; and no
      # merge, approve, label-write, state-move or job-loading path in its source.
      - name: Notifier installer selftest (agent-refused, no secret in output, §13 exit codes)
        run: python3 scripts/pipeline_notifier_setup.py --selftest

      # Stage E's installer — the one command an operator runs. Offline, every
      # transport stubbed: the conf validator reports EVERY bad value in one pass
      # (a first-error-wins mutant turns it red), a settled machine is written to
      # zero times, an agent environment is refused BEFORE the conf is read, the
      # six §13 outcomes each carry their own exit code, no credential reaches any
      # output, and the source carries no merge/approve/protected-label path.
      - name: Stage E installer selftest (idempotent, agent-refused, §13 exit codes)
        run: python3 scripts/pipeline_stage_e_setup.py --selftest

      # Stage E's own GitHub app (KIT-578): the owner's one script that makes it. Offline,
      # GitHub, sudo, openssl, the browser, the clock and the prompt all stubbed: refused in an
      # agent's environment before anything is read; nothing changes without one typed `yes`;
      # the ledger records the app before its key is written; the key, the token and the signed
      # token reach no output, argument, ledger or conf; the conf's keys go in once; a second
      # run is a no-op; no answer from GitHub, or no installation, in time is said; a test
      # comment by another author or a User fails; and `verify` exits 0, 1, 2, 4 or 5.
      - name: Stage E app selftest (agent-refused, one yes, no key in any output)
        run: python3 scripts/pipeline_stage_e_app.py --selftest
      # The shared GitHub App helper (KIT-578): the manifest flow on 127.0.0.1, one API host and no
      # redirect, the paths it may build (none can merge, approve or label), and a token signed by a
      # real openssl over a throwaway key and verified with its public key.
      - name: GitHub App helper selftest (one host, no redirect, a real signed token)
        run: python3 scripts/pipeline_github_app.py --selftest

      # The Stage A (idea-gate) installer: the planning fence (every injected tool server
      # named twice, no Write), agent-env refusal, conf-all-errors, no merge/approve/label
      # verb, and a ticket move only in the one class that refuses tickets it did not
      # file. Since KIT-195 it writes the planning entries after a typed yes, opens the
      # delivery pull request, runs the probe, starts the job and runs the drill — each
      # asked first, each with a refusal case, and the whole suite mutation-tested.
      - name: Stage A installer selftest (fence composition, agent-refused, human gates)
        run: python3 scripts/pipeline_stage_a_setup.py --selftest
      # The one command (KIT-195): levels the skills, brings Stage E up to date after a
      # yes, then runs the Stage A installer. Refused under a model before it reads anything.
      - name: One-command installer selftest (order, agent-refused, never merges)
        run: python3 scripts/pipeline_install.py --selftest

      # The chat-lane composer: prints every piece of the dispatcher's built-in Slack lane.
      # compose, verify and card write nothing; merge --apply, env-names and
      # front-door --apply write pieces 1, 2, 3, 5 and 7 as the role account when a person
      # runs them (KIT-197), and each is refused in an agent environment. The grant is the
      # owner's list — no wildcard, one literal git-pull pair per repository, and a mutant
      # holding Monitor or `Bash(git -C * pull)` turns it red. The Slack fence keeps every
      # inherited default, the deny rules are pinned to .claude/settings.json, verify's ten
      # checks (pf's loaded rules, the anchor point and the front door among them) run
      # against stubs with no env value in any output, the printed pf commands and restarts
      # run through /bin/sh against shims, the three writer programs run for real against
      # temporary files, verify runs nothing but its reads, and the fakes tolerate a Runner
      # that passes cwd.
      - name: Chat lane composer selftest (grant, fence, deny drift, agent-refused)
        run: python3 scripts/pipeline_chat_lane_setup.py --selftest

      # The tech lead's model switch (KIT-385): the owner's one script. It refuses under a
      # model, as root and without a terminal; stops before its one question when a
      # TICKET_MODEL is unset or not yet in the planner's or finding poller's live config,
      # or no Linear key is found, or a planning run is under way, or the default runner
      # is not Claude's; tags every open pipeline ticket still on the default (planning
      # tickets, pieces and findings, started or not, but never a planning ticket whose run
      # is under way), re-read just before each write; and
      # only then writes CHAT_MODEL and runs the chat lane's merge --apply and verify. A
      # "no" changes nothing.
      - name: Tech lead model switch selftest (tickets first, one yes, agent-refused)
        run: python3 scripts/pipeline_model_switch.py --selftest

      # The Slack bridge (KIT-220, KIT-221): the one job that may act for the owner from
      # the chat. Every sender checked with Slack itself (guests, bots, deactivated and
      # other-workspace accounts, edits, files and subtypes refused), its own question
      # bound to its own state, catch-up after sleep, a corrupt state refused, and its own
      # tracker writes exactly four (a move, a hand-over, a comment and a finished plan's
      # follow-up, pinned by a source scan), made only with acting on. Its installer writes the token from a hidden
      # prompt as the role account, never loads the job, and refuses under a model.
      - name: Slack bridge selftest (sender check, question binding, catch-up, pinned writes)
        run: python3 scripts/pipeline_bridge.py --selftest
      # The bridge's transport, split out of it (KIT-312, part 1: KIT-388): its error, its one
      # HTTP call with a redirect refused, and its Slack client, each refusal raised.
      - name: Slack bridge transport selftest (real client, redirect refused, no tracker call)
        run: python3 scripts/pipeline_bridge_transport.py --selftest
      # The rest of the bridge's code, split out of it by concern (KIT-312: KIT-407 and
      # part 3). Each module's own runs its cases, which the bridge's selftest above runs
      # too, and pins that it holds no HTTP call and no GraphQL write of its own; the
      # tracker client, which holds the bridge's four writes, pins that its one HTTP call
      # is the transport's.
      - name: Slack bridge modules selftest (each one's own cases and pins)
        run: |
          python3 scripts/pipeline_bridge_tracker.py --selftest
          python3 scripts/pipeline_bridge_config.py --selftest
          npm run --silent test:bridge-requests
          python3 scripts/pipeline_bridge_answers.py --selftest
          python3 scripts/pipeline_bridge_replan.py --selftest
          python3 scripts/pipeline_bridge_plans.py --selftest
          python3 scripts/pipeline_bridge_pings.py --selftest
          python3 scripts/pipeline_bridge_tech_lead.py --selftest
          python3 scripts/pipeline_bridge_watch.py --selftest
          python3 scripts/pipeline_bridge_direct.py --selftest
          python3 scripts/pipeline_bridge_bind.py --selftest
          python3 scripts/pipeline_bridge_push.py --selftest
          python3 scripts/pipeline_bridge_push_setup.py --selftest
      - name: Slack bridge installer selftest (token, install, verify, agent-refused)
        run: python3 scripts/pipeline_bridge_setup.py --selftest

      # The voice (KIT-294): the notifier may have a model rewrite a page it already
      # wrote. One tool-less `claude -p` run, its command
      # line and its seven-variable environment pinned (one subscription token, never an
      # API key), the facts fenced on stdin, a fresh folder as its home and removed after.
      # Its text is posted only with every keep string, no link outside the facts, no
      # mention, no code block and no credential shape; any failure posts the plain text.
      # The CLI is faked: no model is called in CI.
      - name: Tech lead voice selftest (pinned argv and env, fenced facts, checked text)
        run: python3 scripts/pipeline_voice.py --selftest

      - name: Daily stand-up selftest (asks first, old news never sent, plain text fallback)
        run: python3 scripts/pipeline_standup.py --selftest

      # Sprint planning (KIT-575): one proposal per sprint, built by code from the pool's verdicts; the owner's
      # exact reply records the plan; a damaged file is never planned over; the queue puts planned pieces first.
      - name: Sprint plan selftest (one proposal a sprint; only the exact yes records; nothing is admitted)
        run: python3 scripts/pipeline_sprint_plan.py --selftest
      # The sprint review (KIT-576): a recap built by code, written as a Linear document, linked from one DM
      # message once a sprint. Offline, with GitHub and Linear stood in for.
      - name: Sprint review selftest (once a sprint; never silent; no model)
        run: python3 scripts/pipeline_sprint_review.py --selftest

      - name: Telemetry scrape selftest (contract §4, §10)
        run: python3 scripts/telemetry_scrape.py --selftest

      # The producer side of §4: the block builder, and the `telemetry-required`
      # gate that now validates shape instead of string-matching a marker. Now also
      # covers the bounce-stage emitter (bounce_block/bounce_comment, KIT-94) added
      # alongside the review one — one builder, both stages.
      - name: Telemetry block selftest (contract §4, §8)
        run: python3 scripts/telemetry_block.py --selftest

      # Stage E's telemetry publisher (docs/adr/2026-09-05-…, decision 4). Offline:
      # builds via telemetry_block.py (one definition, review AND bounce), posts
      # exactly one comment to the pinned ticket (stubbed here — no real credential
      # or network in CI), and the source names no Linear mutation beyond
      # commentCreate — the same "cannot escalate" guarantee gh_fallback.py makes,
      # applied to the one place this kit writes to Linear directly.
      - name: Stage E telemetry publisher selftest (comment-only against Linear)
        run: python3 scripts/pipeline_telemetry_local.py --selftest

      - name: Lifecycle observer selftest (contract §4, §10)
        run: python3 scripts/telemetry_lifecycle.py --selftest

      # Contract §13: the safe-outputs job can legitimately apply nothing, so it
      # has to tell "the session wrote no requests" from "the requests could not
      # be read" — and say which. The classification rows AND the step graph that
      # carries them, because a correct classifier behind `continue-on-error`
      # still reports success for a failure.
      - name: Safe-outputs absence-vs-failure selftest (contract §13, §8)
        run: python3 scripts/pipeline_safe_outputs_probe.py --selftest

      # The idea-gate executor: it materialises a planning session's proposed
      # epic tree (§8 "Filing a plan"), forcing every authority field, gating
      # every child through the DoR gate, all-or-nothing. Inert here (no
      # delivery.json, no live dispatcher); --selftest is what has teeth.
      - name: Plan-tree executor selftest (forced fields, DoR gate, §8/§13 verdicts)
        run: python3 scripts/pipeline_plan_executor.py --selftest

      # The planner job: the owner's move into the trigger state is the only start,
      # the delegated ticket is a CLEAN copy of the idea (no routing tag, no label,
      # no project), and a finished session's final message is read back and filed
      # by the executor. Inert here; --selftest is what has teeth, and it drives the
      # real executor and real git over local fixtures.
      - name: Planner job selftest (owner-triggered, clean copy, read-back)
        run: python3 scripts/pipeline_plan_poller.py --selftest

      # User-scope skill drift: a project with no skills directory runs whatever
      # copy sits in ~/.claude/skills, which nothing updates. The check is read-only;
      # --apply refuses in an agent environment.
      - name: User-scope skill sync selftest (drift report, refusal, whole replace)
        run: python3 scripts/sync_user_skills.py --selftest

      # The conflict loop (pr-conflict-monitor.yml + the local waker). Offline, GitHub and
      # the model stubbed, git real: a new conflict requests a fix and pages nobody; the
      # budget (3 per PR) and forks page instead; a missed ack, a missed result, and a
      # result on a still-CONFLICTING PR each escalate exactly once; markers count only
      # from the author allowed to write them and only on a comment's first line, so a
      # session cannot forge one; closed/draft PRs lose a stale label; an unsettled PR
      # fails the run (§13); `wake` refuses an agent environment, root and a dispatcher's
      # role account, takes only a worktree this user's own Claude Code worked in, acks
      # every session of a capped pass before the first starts, declines a dirty
      # worktree, writes a heartbeat on every real pass and exits 1 when it cannot tell;
      # and nothing merges, approves or pushes.
      - name: Conflict loop selftest (request, bounded escalation, stale labels, no merge)
        run: python3 scripts/pr_conflict.py --selftest

      # The waker as a supervised job (scripts/pipeline_conflict_waker_setup.py): a user
      # LaunchAgent, never a role-account daemon; every conf error at once, an unboundable
      # queue refused; the dry run passes the job's own argv and blocks on a sign-off; a
      # loaded job with a stale heartbeat is NOT RUNNING, never "installed"; no sudo path.
      - name: Conflict waker installer selftest (LaunchAgent, heartbeat, agent-refused)
        run: python3 scripts/pipeline_conflict_waker_setup.py --selftest

      # The review-and-update command (scripts/pipeline_update.py, KIT-238): a component
      # it cannot measure is UNKNOWN, never current; the not-checked list prints every time;
      # an update refuses under an agent, stops before any change on a forbidden env name or
      # a missing "yes", never installs over a job launchd still holds, never starts after a
      # failed install, and checks the version that answers.
      - name: Review-and-update selftest (UNKNOWN is not current, agent-refused, safe order)
        run: python3 scripts/pipeline_update.py --selftest

      # The health watch (scripts/pipeline_watch.py, KIT-236): one page per problem and one
      # per recovery; a single bad pass, or no internet, never pages; a GitHub run that
      # failed is not recorded as sent; the status file the monitor reads is world-readable.
      - name: Health watch selftest (alert on change, debounced, delivery checked)
        run: python3 scripts/pipeline_watch.py --selftest

      # The union check (pr-union-check.yml): a check and the fixture it rejects, each green
      # alone, are red together and bisected to the PR that joined last; a textual conflict
      # inside the union is skipped by name; the cap skips loudly; could-not is its own
      # verdict; the battery sees no token and no runner step file; no ref in the checkout moves.
      - name: Union check selftest (green alone, red together, bisected, report-only)
        run: python3 scripts/check_pr_union.py --selftest

      # KIT-617. These batteries had no step of their own: they ran in CI only inside the leak
      # sweeps (check_temp_leaks.py runs every package.json test:* script). The sweeps are a
      # separate job now, which is not required to merge until the owner adds it, so each one
      # is named here to keep blocking a merge. A new test:* script needs a step above or here.
      - name: Batteries with no step of their own (kept required after the leak sweeps moved)
        run: |
          python3 scripts/pipeline_ws_client.py --selftest
          python3 scripts/pipeline_bridge_handover.py --selftest
          python3 scripts/pipeline_tech_lead_tools.py --selftest
          python3 scripts/pipeline_tech_lead_turn.py --selftest
          python3 scripts/pipeline_sprint.py --selftest
          python3 scripts/pipeline_acceptance_poller.py --selftest
          python3 scripts/pin_hooks_path.py --selftest
          python3 scripts/pipeline_machine_tickets.py --selftest
          python3 scripts/pipeline_routing_tags.py --selftest
          python3 .claude/skills/sync-kit/compare.py --selftest

      - name: Dashboard selftest (self-contained page, one summary object)
        run: python3 scripts/telemetry_dashboard.py --selftest

      - name: Weekly-review limits selftest (no self-raised budgets or graders)
        run: python3 scripts/check_weekly_review.py --selftest

      # The cyrus-setup/teardown patterns are here for a reason that is not obvious from
      # the filename: if a worktree ROOT contains one, the dispatcher EXECUTES it on
      # worktree creation — with the full daemon environment, OUTSIDE the OS sandbox,
      # before the agent session exists, and with no config key to opt out. It is
      # discovered from the checked-out BRANCH, so branch-write access to a managed
      # repository would be arbitrary code execution with every secret the daemon holds.
      #
      # This cannot live in a PreToolUse hook: a hook constrains the agent, and this runs
      # before there is an agent. CI is the only layer that reads a branch's contents
      # independently of who wrote them. Matched in any directory rather than only the
      # root — a file that can be moved to the root should not pass review either.
      # (KIT-78; KIT-48 runbook Part 18, which recorded the surface on 2026-08-27.)
      - name: Block forbidden paths (planning/, real .env, key material, setup scripts)
        run: |
          # -z, then one name a line: a quoted `"planning/\303\251.md"` matched nothing.
          FORBIDDEN=$(git ls-files -z | tr '\0' '\n' \
            | grep -E '^planning/|(^|/)\.env|\.pem$|\.key$|(^|/)cyrus-(setup|teardown)\.(sh|ps1|cmd|bat)$' \
            | grep -v -E '(^|/)\.env\.example$' \
            || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files are tracked in git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The alert templates (pipeline-failure-alert, cron-health, frontend-uptime,
      # migration-drift) and pipeline-dispatch's capacity notice share one recipient
      # rule: ALERT_PAGE_TO, else a person who owns
      # the repo, else the issue says "Nobody was paged" and the run fails — an @mention of
      # an org notifies nobody. The rule is JavaScript inside YAML that nothing else ever
      # executes before production, so this runs every copy under node against a mock
      # GitHub, and fails on a copy that drifted or a workflow that pages the owner blindly.
      # After setup-node (it needs node) and the parse step (it needs pyyaml).
      - name: Alert pages reach a person, or fail their run
        run: python3 scripts/check_alert_pages.py

      # The scan itself is the job's first step. This proves the PR's copy of it with the
      # real secretlint: a key is found in every file shape it handles, a scan secretlint
      # did not finish is never clean, and this workflow, the template's and lint:secrets
      # run the same scan (KIT-400).
      - name: Secret scan selftest (every file shape, never a false clean)
        run: python3 scripts/check_secret_scan.py --selftest

      # KIT-450. The helper every battery's temp folders live in: one folder per run,
      # removed on a pass, a failure, Ctrl-C or a SIGTERM. Then the check that holds the
      # batteries to it, proved on batteries that leak, fail, hang and leave a process.
      - name: Scratch-run helper selftest (one folder per run, gone however the run ends)
        run: python3 scripts/scratch_run.py --selftest

      - name: Temp-leak check selftest (a leak, a stray process, a timeout, its own folder)
        run: python3 scripts/check_temp_leaks.py --selftest
      # The cleanup probe (KIT-468): the owner's before/after proof that a run left nothing. Offline, on a fake role
      # home: names and sizes only, retained areas and logs not judged, unread areas never clean, refused under a model.
      - name: Cleanup probe selftest (what a run left behind; unread is never clean)
        run: python3 scripts/pipeline_cleanup_probe.py --selftest

  # KIT-617. The two leak sweeps used to be the last steps of Kit checks and took about
  # 7.5 minutes together (6.5 and 1), which put Kit checks at 12.6 to 14.4 minutes against a
  # 15-minute limit. Measured as a job on #511: 7.6 and 7.7 minutes, so 20 leaves room.
  # A busy runner then cancelled PRs that had failed nothing. They are their own job now, beside the selftests, with their own limit. NOT a required check until the owner adds it
  # (docs/TESTING.md, "Job limits and what to do near one"): until then a leak is red on the
  # PR but does not block the merge.
  temp-leak-sweeps:
    name: Temp-leak sweeps
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The secret-scan battery needs secretlint.
      - name: Install dependencies
        run: npm ci

      - name: Selftests leave nothing behind (every battery, its own TMPDIR)
        run: python3 scripts/check_temp_leaks.py

      - name: Selftests leave nothing behind on a SIGTERM either (each stopped 1 s in)
        run: python3 scripts/check_temp_leaks.py --sigterm 1

  # This template is public and must stay project-neutral. This job fails on
  # absolute home paths and real email addresses in tracked files; the "don't
  # name another project" rule is a convention in CLAUDE.md, not enforced here.
  provenance-scan:
    name: Provenance scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No home paths or real emails in tracked files
        run: python3 scripts/check_provenance.py
