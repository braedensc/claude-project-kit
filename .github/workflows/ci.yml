name: CI

# The kit's own CI — the kit lints itself. Layer 3 of the 3-layer security model
# (docs/SECURITY.md). Distilled from a production build's ci.yml (live
# 2026-06-23 → 2026-07-03); the app-project version with lint/typecheck/test/e2e
# jobs lives at templates/workflows/ci.yml.
#
# The job `name:` IS the required-status-check context. Branch protection
# requiring "Kit checks" is set only AFTER this workflow's first green run on
# main — requiring a context before it has ever reported wedges every open PR
# (merge-THEN-require; see docs/LESSONS.md).

on:
  push:
    branches: [main]
  # Run on every PR regardless of base branch — so stacked PRs (base != main)
  # are gated too, not just PRs that target main directly. `labeled`/`unlabeled`
  # are included so "Hooks change guard" re-evaluates the moment a
  # `hooks-change` label is added or removed (the default PR activity types —
  # opened/synchronize/reopened — don't cover labels).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  kit-checks:
    name: Kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Hook battery (block/allow)
        run: python3 .claude/hooks/test_hooks.py

      # Characterization, not aspiration: fails only when the RECORDED result of
      # a GuardFall probe changes — a guard that started leaking, or one that was
      # hardened without updating the record and the two docs. See the file's
      # docstring and docs/SECURITY.md.
      - name: GuardFall bypass battery (recorded results still hold)
        run: python3 .claude/hooks/test_guard_bypass.py

      - name: Validate all tracked JSON/YAML
        run: |
          python3 -m pip install --quiet pyyaml
          git ls-files '*.json' '*.yml' '*.yaml' | python3 -c '
          import json, sys, yaml
          bad = []
          for f in sys.stdin.read().split():
              try:
                  with open(f) as fh:
                      if f.endswith(".json"):
                          json.load(fh)
                      else:
                          list(yaml.safe_load_all(fh))
              except Exception as e:
                  bad.append(f + ": " + str(e))
          print("\n".join(bad) if bad else "all tracked JSON/YAML parse OK")
          sys.exit(1 if bad else 0)
          '

      # Parsing proves a workflow is well-formed, not that it can START. A job
      # doing `uses: ./…` whose permissions are narrower than the callee declares
      # ends the whole RUN as `startup_failure` — no jobs, no annotations, no
      # check run, nothing in the PR's checks list. This is the one class of
      # workflow bug a checks list can never surface, and it is fully decidable
      # from the two files, so it is checked here rather than discovered live.
      # Runs immediately after the parse step, which is what installs pyyaml.
      - name: Reusable-workflow call contracts selftest
        run: python3 scripts/check_workflow_calls.py --selftest

      - name: Reusable-workflow calls in this repo can start
        run: python3 scripts/check_workflow_calls.py

      - name: Placeholder integrity (used == documented)
        run: python3 scripts/check_placeholders.py

      - name: Definition-of-Ready gate selftest
        run: python3 scripts/check_ticket_dor.py --selftest

      # The vendored draft 2020-12 subset the schemas are held to. Its guarantee
      # — an unrecognized keyword is an error, never a silent no-op — is what
      # makes "the schema enforces this" a true statement.
      - name: Vendored JSON Schema validator selftest
        run: python3 scripts/jsonschema_mini.py --selftest

      # schemas/ ⇄ docs/PIPELINE-CONTRACT.md. Fails if §1 grows a field the
      # schema does not define (or vice versa), if delivery.example.json drifts
      # from the spec, or if the malformed shape /setup-board once emitted stops
      # being rejected. One definition, two renderings.
      - name: Schema ⇄ contract parity selftest
        run: python3 scripts/check_schemas.py --selftest

      # Belt to that braces: validates this repo's own instances outside the
      # selftest's fixtures, so a bad delivery.example.json fails even if the
      # selftest were somehow skipped.
      - name: Validate this repo's JSON documents against schemas/
        run: python3 scripts/check_schemas.py

      # The generation-side half: every producer of a schema'd document refuses
      # to WRITE a malformed one, rather than writing it and being told later.
      # Includes the two gates that live in workflow steps rather than in this
      # script — the review normalizer is extracted and executed, not grepped.
      - name: Generation-side gate selftest (contract §12, §14)
        run: python3 scripts/emit_document.py --selftest

      # The kit ships no live delivery.json, so the validator is inert here by
      # design (contract §2: absent is OFF). --selftest is what has teeth in CI.
      - name: delivery.json validator selftest (contract §7)
        run: python3 scripts/check_delivery_config.py --selftest

      # Belt-and-braces: if a delivery.json ever appears in this repo it is a
      # mistake (§1 — the kit ships delivery.example.json only), and this run
      # would catch it as a validation failure rather than shipping it silently.
      - name: delivery.json validity (no-op unless one exists)
        run: python3 scripts/check_delivery_config.py

      # Tier 0, the human-run local dispatcher. Also the drift check on the ONE
      # pin-key derivation: this script, the PreToolUse hook and
      # templates/workflows/pipeline-dispatch.yml must agree on
      # sha256(realpath(session root))[:16], or every pin silently reads as
      # absent and `/work` fails closed for a reason nobody can see.
      - name: Local dispatcher selftest (contract §2, §3)
        run: python3 scripts/pipeline_dispatch_local.py --selftest

      # The autonomy gates and the telemetry pipeline. Same posture as the two
      # above: inert in this repo (no delivery.json, no store), so the selftests
      # are what has teeth. Each asserts its own contract rows against synthetic
      # fixtures — §5/§11 for the two gates, §4/§10 for the collector.
      - name: Auto-approval gate selftest (contract §5, §11)
        run: python3 scripts/check_auto_approve.py --selftest

      - name: Auto-merge tier selftest (contract §11)
        run: python3 scripts/check_auto_merge.py --selftest

      # The gate below ("Hooks change guard") runs the BASE copy of this script,
      # so its own logic is verified here on the head — gated set and, above all,
      # who is allowed to supply the acknowledging label.
      - name: Grader-path gate selftest (floor + label identity)
        run: python3 scripts/check_grader_paths.py --selftest

      # gh cannot verify TLS inside the sandbox (KIT-71): Go on darwin ignores
      # SSL_CERT_FILE and asks a keychain service the sandbox blocks. This is the
      # REST fallback sessions use instead; the selftest is offline and asserts,
      # among other things, that it still cannot merge.
      - name: GitHub REST fallback selftest (no merge capability)
        run: python3 scripts/gh_fallback.py --selftest

      # Stage E's local reviewer core (docs/adr/2026-09-05-…). Offline: asserts a
      # decline is never a clean green (§13/TOD-112), a malformed findings file is
      # unusable not silently smaller (§14), and the script builds no approve/merge/
      # label path — the same "cannot escalate" guarantee gh_fallback makes.
      - name: Stage E local reviewer selftest (comment-only, decline≠clean)
        run: python3 scripts/pipeline_review_local.py --selftest

      # Stage E's basis resolver (docs/adr/2026-09-05-…, decision 2 — "the snapshot
      # problem"). Offline: tier ordering (history > reconciler > live), tier 1 proven
      # immune to a post-delegation edit BY CONSTRUCTION (its signature accepts no live
      # issue), the edit-after-delegation flag computed from the live ticket regardless
      # of which tier answered, an honestly empty basis is not a crash, and the script
      # never constructs a Linear write mutation — read-only, like the reviewer it feeds.
      - name: Stage E basis resolver selftest (tier ordering, read-only against Linear)
        run: python3 scripts/pipeline_review_basis.py --selftest
      # Stage E's poller (option 4): creates + delegates one review ticket per new pipeline
      # PR, reads the reviewer's answer back and publishes it. Offline: asserts the
      # sanitizer strips dispatcher routing tags and fence tokens, the ticket is never
      # parented, malformed/tampered/timed-out read-backs decline loudly, one comment and
      # one outcome per PR, the seen-set is written through so one PR's crash never costs
      # another its record (no second paid reviewer session), a credential shape in the
      # reviewer's text is withheld over the real publish path, and no approve/merge/label
      # path exists.
      - name: Stage E review poller selftest (sanitizer, decline paths, comment-only)
        run: python3 scripts/pipeline_review_poller.py --selftest
      # Stage E's finding poller (KIT-96 local backend): a session's pipeline-finding/1
      # comment becomes a backlog ticket, filed by the role account, forcing state,
      # provenance:agent, owner-subscribe; never ready, never a protected label, never an
      # assignee. Offline selftest asserts the parse, dedup, both flood caps, and shape.
      - name: Stage E finding poller selftest (create-shape, dedup, flood caps)
        run: python3 scripts/pipeline_finding_poller.py --selftest
      # Stage E's bounce driver (same ADR, decision 5, option 4). Offline, every read
      # and write stubbed and recorded: bounce numbers N-1/N/N+1 ⇒ bounce/bounce/exhaust,
      # the ledger row lands BEFORE the re-prompt is sent (a failed send is still spent,
      # and the PR is told), an unreadable or corrupt ledger is REFUSED rather than read
      # as zero, `exhaust` refuses unless the verdict is exhaust (never a label outside a
      # spent budget, never on a fork or a closed PR), only the base branch's REQUIRED
      # checks count (an unknown required set is not a trigger), a ticket named only by
      # the branch must own the PR in Linear's record, a non-pipeline branch is declined,
      # a terminal ticket is skipped with a reason, an absent committed delivery.json is
      # OFF and NAMED (§2/§13, never silent) while a broken one is said once on the PR,
      # a ticket with no agent-session thread gets the fallback fix ticket with its
      # [repo=name#branch] tag and push instruction, the sanitizer strips routing tags
      # and fence tags from every copied text, the ONLY label ever written is
      # agent:needs-human on exhaustion, and the source builds no merge/approve/auto-merge
      # path and launches no agent session.
      # Also the three owner corrections of 2026-09-06: the driver runs as the dispatcher's
      # role account under a system daemon, so ONE config file serves it and the poller
      # (their key spellings aliased, unknown keys ignored), a state dir inside a git
      # working tree is REFUSED and one outside the account's home warns, and the one-shot
      # `run` pass leaves a heartbeat on every path, isolates one PR's crash from the pass
      # and reports a deadline as PARTIAL rather than clean; the original ticket is named
      # by LINEAR'S attachment record before the branch name, whose fallback says why; and
      # the ledger stays the budget authority while the re-prompt carries a visible record
      # that can make the driver REFUSE but can never grant it a bounce.
      - name: Stage E bounce driver selftest (ledger-first re-prompt, one label, no merge)
        run: python3 scripts/pipeline_bounce_local.py --selftest

      # Stage E's installer — the one command an operator runs. Offline, every
      # transport stubbed: the conf validator reports EVERY bad value in one pass
      # (a first-error-wins mutant turns it red), a settled machine is written to
      # zero times, an agent environment is refused BEFORE the conf is read, the
      # six §13 outcomes each carry their own exit code, no credential reaches any
      # output, and the source carries no merge/approve/protected-label path.
      - name: Stage E installer selftest (idempotent, agent-refused, §13 exit codes)
        run: python3 scripts/pipeline_stage_e_setup.py --selftest

      # The Stage A (idea-gate) installer: the fallback-(b) tool-fence composition
      # (no Linear MCP attached; Write kept), agent-env refusal, conf-all-errors,
      # and no move/approve/merge verb in its own source. Composes-and-hands-off
      # the dispatcher entry; never turns the gate on.
      - name: Stage A installer selftest (fence composition, agent-refused, human gates)
        run: python3 scripts/pipeline_stage_a_setup.py --selftest

      - name: Telemetry scrape selftest (contract §4, §10)
        run: python3 scripts/telemetry_scrape.py --selftest

      # The producer side of §4: the block builder, and the `telemetry-required`
      # gate that now validates shape instead of string-matching a marker. Now also
      # covers the bounce-stage emitter (bounce_block/bounce_comment, KIT-94) added
      # alongside the review one — one builder, both stages.
      - name: Telemetry block selftest (contract §4, §8)
        run: python3 scripts/telemetry_block.py --selftest

      # Stage E's telemetry publisher (docs/adr/2026-09-05-…, decision 4). Offline:
      # builds via telemetry_block.py (one definition, review AND bounce), posts
      # exactly one comment to the pinned ticket (stubbed here — no real credential
      # or network in CI), and the source names no Linear mutation beyond
      # commentCreate — the same "cannot escalate" guarantee gh_fallback.py makes,
      # applied to the one place this kit writes to Linear directly.
      - name: Stage E telemetry publisher selftest (comment-only against Linear)
        run: python3 scripts/pipeline_telemetry_local.py --selftest

      - name: Lifecycle observer selftest (contract §4, §10)
        run: python3 scripts/telemetry_lifecycle.py --selftest

      # Contract §13: the safe-outputs job can legitimately apply nothing, so it
      # has to tell "the session wrote no requests" from "the requests could not
      # be read" — and say which. The classification rows AND the step graph that
      # carries them, because a correct classifier behind `continue-on-error`
      # still reports success for a failure.
      - name: Safe-outputs absence-vs-failure selftest (contract §13, §8)
        run: python3 scripts/pipeline_safe_outputs_probe.py --selftest

      # The idea-gate executor: it materialises a planning session's proposed
      # epic tree (§8 "Filing a plan"), forcing every authority field, gating
      # every child through the DoR gate, all-or-nothing. Inert here (no
      # delivery.json, no live dispatcher); --selftest is what has teeth.
      - name: Plan-tree executor selftest (forced fields, DoR gate, §8/§13 verdicts)
        run: python3 scripts/pipeline_plan_executor.py --selftest

      - name: Dashboard selftest (self-contained page, one summary object)
        run: python3 scripts/telemetry_dashboard.py --selftest

      - name: Weekly-review limits selftest (no self-raised budgets or graders)
        run: python3 scripts/check_weekly_review.py --selftest

      # The cyrus-setup/teardown patterns are here for a reason that is not obvious from
      # the filename: if a worktree ROOT contains one, the dispatcher EXECUTES it on
      # worktree creation — with the full daemon environment, OUTSIDE the OS sandbox,
      # before the agent session exists, and with no config key to opt out. It is
      # discovered from the checked-out BRANCH, so branch-write access to a managed
      # repository would be arbitrary code execution with every secret the daemon holds.
      #
      # This cannot live in a PreToolUse hook: a hook constrains the agent, and this runs
      # before there is an agent. CI is the only layer that reads a branch's contents
      # independently of who wrote them. Matched in any directory rather than only the
      # root — a file that can be moved to the root should not pass review either.
      # (KIT-78; KIT-48 runbook Part 18, which recorded the surface on 2026-08-27.)
      - name: Block forbidden paths (planning/, real .env, key material, setup scripts)
        run: |
          FORBIDDEN=$(git ls-files \
            | grep -E '^planning/|(^|/)\.env|\.pem$|\.key$|(^|/)cyrus-(setup|teardown)\.(sh|ps1|cmd|bat)$' \
            | grep -v -E '(^|/)\.env\.example$' \
            || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files are tracked in git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: secretlint (scan all tracked files)
        run: git ls-files -z | xargs -0 npx secretlint --secretlintrc .secretlintrc.json

  # This template is public and must stay project-neutral. This job fails on
  # absolute home paths and real email addresses in tracked files; the "don't
  # name another project" rule is a convention in CLAUDE.md, not enforced here.
  provenance-scan:
    name: Provenance scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No home paths or real emails in tracked files
        run: python3 scripts/check_provenance.py

  # Server-side backstop for hook self-protection (docs/SECURITY.md; ported from
  # a production build's audit job). Local self-protection constrains only
  # sessions that run the hook — a PR authored anywhere else (another clone, the
  # GitHub web UI, an @claude workflow) never meets it. So a PR that changes a
  # GRADER path must not land unnoticed: it has to carry an explicit
  # `hooks-change` label. The gated set is the guard machinery
  # (.claude/hooks/**, .claude/settings*.json), the CI workflows that gate the PR
  # itself (.github/workflows/**), the graders those workflows run
  # (scripts/check_*.py) together with the dispatch path they import
  # (scripts/pipeline_*.py, scripts/jsonschema_mini.py) and the
  # templates/workflows/pipeline-*.yml sources they are synced from, and — when a
  # project has opted into the agentic delivery pipeline — `delivery.json` plus
  # everything in its `autonomy.riskPaths`, read from the PR's BASE sha (a head
  # that could shorten its own riskPaths would be grading its own homework). The
  # authoritative list is FLOOR in scripts/check_grader_paths.py, whose selftest
  # asserts every file in the covered directories is gated or explicitly excused.
  # Same job, same label as before: one flag, not a second taxonomy to keep in sync.
  # Operational notes (learned in production):
  #   - the `hooks-change` label must EXIST in the repo before this job's first
  #     run can pass on a guarded PR (gh label create hooks-change …);
  #   - adding/removing the label re-runs the check via the labeled/unlabeled
  #     trigger types above; if a run ever wedges, an empty commit gives a
  #     clean re-run;
  #   - this flag only becomes a real gate once branch protection requires a
  #     review (required_approving_review_count >= 1, owner-set in the GitHub
  #     UI) so a human actually sees it. PR-only — a push to main has no label
  #     context;
  #   - HEAD CONTEXT: this job runs from the PR's own checkout, so a PR can edit
  #     the workflow and the script that gate it. The base-sha reads above close
  #     the config half of that hole, not the code half. The property "a green
  #     check can never be produced by the code under review" needs
  #     `pull_request_target` (base-ref workflow) PLUS a required review —
  #     owner-set, and deliberately not claimed until both are in place.
  hooks-change-guard:
    name: Hooks change guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # `issues: read` is what lets the job ask WHO applied the label (the PR
    # events API). Without it the applier is unknowable and the gate fails closed.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the 'hooks-change' label to edit grader paths
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the BASE revision of the gate, never the PR's own copy. A head
          # that can rewrite FLOOR — or delete the identity check below it — is
          # grading its own homework; this is the same rule the script already
          # applies to delivery.json, extended to the script itself. The fallback
          # covers only the commit that first introduces the file.
          gate="$RUNNER_TEMP/check_grader_paths.py"
          if ! git show "$BASE_SHA:scripts/check_grader_paths.py" > "$gate" 2>/dev/null; then
            echo "::notice::base has no grader script yet — using the head copy"
            cp scripts/check_grader_paths.py "$gate"
          fi
          python3 "$gate"
