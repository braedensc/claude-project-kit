name: PR conflict monitor

# ══════════════════════════════════════════════════════════════════════════════
# The kit's OWN conflict monitor — the ACTIVE twin of the inert app-project
# template at templates/workflows/pr-conflict-monitor.yml. The template stays
# inert (app projects activate it with `git mv` at bootstrap); this copy is
# adapted for this repo and runs here.
#
# The hole it closes: the Stop hook's DIRTY gate (.claude/hooks/stop-pr-check.py)
# reads a PR's merge state only at TURN-END, only in the session that owns the
# branch. The kit's normal mode is several parallel PRs off one main, so the
# common case is a PR that is clean when its session ends and goes CONFLICTING
# LATER, when a sibling merges. PR #27 sat DIRTY unnoticed (2026-08-24), so this
# monitor was added — and in 2026-09 it detected eight conflicts from one wave of
# thirteen parallel sessions correctly, and every one still waited for a person
# to wake its idle session by hand. Detection without resolution.
#
# So a conflict now STARTS A FIX. The logic lives in scripts/pr_conflict.py
# (monitor half here; one marker grammar, one selftest in CI). Per new episode:
#   • budget left (3 automated attempts per PR, lifetime) → label + a `request`
#     comment, answered by whoever owns the branch's session: a LOCAL session's
#     PR by the conflict waker — a supervised LaunchAgent on the machine that
#     holds the worktree (scripts/pipeline_conflict_waker_setup.py), which wakes
#     a capped session there under the repo's hooks; a DISPATCHER's PR by the
#     Stage E bounce driver, in the session's own thread and sandbox. Neither
#     merges or approves, and neither can take the other's PR.
#   • no ack in 15 min, no result in 2 h, or a result while GitHub still says
#     CONFLICTING → ESCALATE once: @mention + assign the owner. Budget spent, or
#     a fork → page straight away, never request.
#
# Why not the template's `@claude` handoff: it needs claude.yml, which this repo
# does not run, a model credential in Actions, and a PAT — GITHUB_TOKEN-authored
# comments and pushes fire no workflows, so neither the handoff nor the fix's CI
# would start. And it would run the model outside the PreToolUse hooks. The local
# sessions that own these branches already have the credentials and the hooks.
# The cost: the loop closes only while a waker runs and its machine is awake.
# When it doesn't, the deadline turns that into the same page as before.
#
# Kept from the template — the parts that are the design:
#   • The LABEL is the dedupe key: one request (or page) per episode, cleared
#     when the PR is mergeable again so a later conflict opens a new episode.
#   • Drafts are skipped. THIS WORKFLOW NEVER MERGES, approves, rebases or pushes,
#     and writes no label but `conflict`. (The local hooks cannot reach an Actions
#     runner, so that has to hold by construction — the selftest asserts it.)
#   • Push to main + an hourly backstop, and a BOUNDED re-query while GitHub
#     computes `mergeable` lazily. A PR that never settles fails the run (contract
#     §13): "could not tell" must never read as "no conflicts".
#
# Fixed here: the label used to be removed only from OPEN non-draft PRs, so a PR
# labeled while conflicted and merged before the next tick kept `conflict`
# forever. Each run now also sweeps closed/merged PRs and drafts carrying it.
#
# Zero new secrets. Scheduled runs only ever fire from the default branch; use
# workflow_dispatch to test. The union check (green alone, red together) is
# pr-union-check.yml.
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *' # every 20 min: the ack deadline is only as prompt as the next tick
  workflow_dispatch:

permissions:
  contents: read
  issues: write # labels + comments on a PR go through the issues API
  pull-requests: write

# Three triggers can collide (a merge to main during a scheduled tick). Serialize
# rather than cancel: a cancelled run could die between "add label" and "post
# comment", leaving the dedupe key set with nothing explaining it.
concurrency:
  group: pr-conflict-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan open PRs for conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default-branch copy of the script (push/schedule/dispatch never check
      # out PR code), and no credential left in .git — this job never pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Request fixes, escalate stalled ones, clear stale labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pr_conflict.py monitor
